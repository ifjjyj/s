name: Sync Upstream Ruleset

on:
  schedule:
    - cron: '17 20 * * *'   # UTC 20:17 = 北京时间 04:17，错开整点拥堵
  workflow_dispatch:

# contents: 向自己的仓库推送分支；actions: 保活步骤需要
permissions:
  contents: write
  actions: write

# 防止上一次还没跑完、下一次又触发，导致两次推送互相冲突
concurrency:
  group: sync-upstream-ruleset
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7   # 当前最新大版本，使用 Node.js 24
        with:
          fetch-depth: 0

      - name: Sync from Upstream
        env:
          GH_TOKEN: ${{ github.token }}   # install_singbox 用 gh 下载 sing-box 需要
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 所有临时文件放在 RUNNER_TEMP，不会污染仓库工作区
          WORK="$RUNNER_TEMP/work"
          rm -rf "$WORK" && mkdir -p "$WORK"

          # ------------------------------------------------------------
          # 开关
          # ------------------------------------------------------------

          # 是否对 b 分支（DustinWin 的 sing-box 规则集，原本是原样同步）也做域名合并优化：1 = 做，0 = 保持原样
          # a、c 分支的域名规则集始终会做合并优化；m 分支是 mihomo 格式，不涉及
          OPTIMIZE_B=1

          # ------------------------------------------------------------
          # 命名规则表
          # ------------------------------------------------------------

          # 【手动改名表】a、c 两个分支共用，优先级最高（高于 RENAME 和自动规则）
          # 键是去掉 geosite- 前缀后的原始名称，值是最终名称。
          # 用途一：域名规则集名字等于 "<国家代码>ip" 时，避免与 ip 规则集撞名
          #         （geosite-noip 与 geoip-no 的 noip）。
          # 用途二：特殊规则集单独命名（category-ads-all -> ad）。
          # 用途三：两个规则集自动改名后会变成同一个名字时，手动给其中一个指定名字。
          #   - google-scholar 去前缀会与 category-scholar-!cn 撞名（都是 scholar），
          #     后者是更大的国外学术合集，占用 scholar，前者手动命名为 googlescholar。
          #   - games：上游有 category-games（国内外合集）、category-games-cn（国内）、
          #     category-games-!cn（国外）。国外版按规则变成 games，国内版是 games-cn，
          #     合集版手动命名为 gamesall（含 @ads / @cn / @telemetry 属性版本）。
          # 以后日志里出现撞名警告，在这里加一行即可：[原名]=新名
          declare -A SITE_FIX=(
            [noip]=noipsite
            [google-scholar]=googlescholar
            [category-ads-all]=ad
            [category-games]=gamesall
            [category-games@ads]=gamesall@ads
            [category-games@cn]=gamesall@cn
            [category-games@telemetry]=gamesall@telemetry
          )

          # 【特殊重命名表】仅 a 分支使用：geosite-<键>.srs -> <值>.srs
          # 优先级高于自动改名规则
          # （google-play、google-gemini 等已由 "去 google- 前缀" 的通用规则覆盖，无需再列）
          declare -A RENAME=(
            [category-media]=media
          )

          # 【已占用名称表】用来判断自动改名后会不会和现有名称撞名
          # 每个分支生成文件前会重新填充
          declare -A TAKEN=()

          # 【命名缓存】同一个规则集的 .json 和 .srs 只计算一次，日志也只提示一次
          # 每个分支生成文件前会清空
          declare -A MAPPED=()

          # ------------------------------------------------------------
          # 工具函数
          # ------------------------------------------------------------

          # clone <仓库地址> <分支> <目标目录>：浅克隆上游指定分支
          clone() { git clone -q --depth 1 --branch "$2" "$1" "$3"; }

          # put <源文件> <目标文件>：复制文件，目标已存在时给出警告（说明发生了重名覆盖）
          put() {
            if [ -e "$2" ]; then
              echo "::warning::重名覆盖：$(basename "$2")"
            fi
            cp "$1" "$2"
          }

          # keep_old <名称>：合并/生成失败时，沿用远端 c 分支上一次的 <名称>.srs 和 <名称>.json
          # （publish_branch 会先清空分支，不沿用的话这一天该规则集就会消失）
          keep_old() {
            local ext
            for ext in srs json; do
              if git cat-file -e "origin/c:$1.$ext" 2>/dev/null; then
                git show "origin/c:$1.$ext" > "$WORK/out-c/$1.$ext"
              fi
            done
          }

          # is_plain <域名规则集原名>：返回 0 表示 "不会被自动改名"（名称保持原样）
          # 自动改名的三种情况（@ 属性部分不参与判断）：
          #   1. 以 category- 开头
          #   2. 以 google- 开头（google-cn 除外）
          #   3. 主体部分以 -!cn 结尾
          is_plain() {
            local k="$1" b="${1%%@*}"
            if [[ "$k" == category-?* ]]; then return 1; fi
            if [[ "$b" == google-?* && "$b" != "google-cn" ]]; then return 1; fi
            if [[ "$b" == *"-!cn" ]]; then return 1; fi
            return 0
          }

          # _site_calc <域名规则集名> <是否使用RENAME表：1/0>
          # 实际计算最终名称，结果放在全局变量 SN 里
          # （不用 echo 返回，是为了让日志提示能直接输出到 Actions 日志）
          # 优先级：SITE_FIX > RENAME > 自动规则（去 category-、去 google-、去 -!cn）> 原名
          # 自动规则撞名时：
          #   - 只去了 category-：改为在名称后加 all（xxxall）
          #   - 去了 google- 或 -!cn：含义不同，不自动合并，保留原名并警告
          _site_calc() {
            local k="$1" use_rename="$2" s base attr cand alt had_cat=0 had_ncn=0 had_g=0
            if [ -n "${SITE_FIX[$k]:-}" ]; then
              SN="${SITE_FIX[$k]}"; return
            fi
            if [ "$use_rename" = 1 ] && [ -n "${RENAME[$k]:-}" ]; then
              SN="${RENAME[$k]}"; return
            fi

            s="$k"
            if [[ "$k" == category-?* ]]; then
              s="${k#category-}"; had_cat=1
            fi
            base="${s%%@*}"; attr="${s#"$base"}"     # 拆出主体和 @属性
            if [[ "$base" == google-?* && "$base" != "google-cn" ]]; then
              base="${base#google-}"; had_g=1        # 去掉 google- 前缀（google-cn 除外）
            fi
            if [[ "$base" == *"-!cn" && -n "${base%"-!cn"}" ]]; then
              base="${base%"-!cn"}"; had_ncn=1       # 去掉 -!cn 后缀
            fi

            # 没有任何需要改的地方：保持原名
            if [ "$had_cat" = 0 ] && [ "$had_ncn" = 0 ] && [ "$had_g" = 0 ]; then
              SN="$k"; return
            fi

            cand="${base}${attr}"
            if [ -z "${TAKEN[$cand]:-}" ]; then
              SN="$cand"; return
            fi

            # 以下是撞名的处理
            if [ "$had_ncn" = 1 ] || [ "$had_g" = 1 ]; then
              echo "::warning::$k 自动改名会与已有的 $cand 撞名，已保留原名（可在 SITE_FIX 里手动指定）"
              SN="$k"; return
            fi
            alt="${base}all${attr}"
            if [ -z "${TAKEN[$alt]:-}" ]; then
              echo "::notice::$k 去前缀会与 $cand 撞名，已命名为 $alt"
              SN="$alt"
            else
              echo "::warning::$k 去前缀与加 all 均撞名，已保留原名"
              SN="$k"
            fi
          }

          # site_name <域名规则集名> <是否使用RENAME表：1/0>：带缓存的包装
          site_name() {
            if [ -n "${MAPPED[$1]:-}" ]; then
              SN="${MAPPED[$1]}"
            else
              _site_calc "$1" "$2"
              MAPPED[$1]="$SN"
            fi
          }

          # dw_name <DustinWin 规则集名>：结果放在全局变量 DN 里
          # 默认在名称后加 2（cn -> cn2）；加 2 后与已有名称撞名的，在 case 里手动指定
          #   - bilibili 加 2 会与 lyc 的 bilibili2（geosite-bilibili2）撞名，
          #     lyc 的保持原名，DustinWin 的命名为 bilibili22
          dw_name() {
            case "$1" in
              bilibili) DN="bilibili22" ;;
              *)        DN="${1}2" ;;
            esac
          }

          # publish_branch <分支名> <源目录>
          # 把源目录的内容发布到自己仓库的指定分支：
          #   - 不强推，历史保留
          #   - 先清空分支再放入新文件，所以上游删除的文件也会同步删除
          #   - 无论内容有无变化都提交并推送（无变化时为空提交），每次运行都留下同步记录
          publish_branch() {
            local br="$1" src="$2"

            # 保护：源目录为空时直接报错跳过，避免把分支清空后提交
            if [ -z "$(ls -A "$src")" ]; then
              echo "::error::$br 的源目录为空，已跳过"
              return 1
            fi

            # 远端已有该分支就基于它继续；没有就新建孤儿分支（无历史）
            if git ls-remote --exit-code --heads origin "$br" >/dev/null 2>&1; then
              git fetch -q origin "$br"
              git checkout -q -f -B "$br" "origin/$br"
            else
              git checkout -q --orphan "$br"
            fi

            # 清空旧内容，再放入新内容
            git rm -rf . -q 2>/dev/null || true
            git clean -fdxq
            cp -a "$src"/. .

            # 强制提交：--allow-empty 保证没有差异时也会生成一条提交
            git add -A
            if [ -n "$(git status --porcelain)" ]; then
              git commit -q -m "sync $br $(date -u +'%Y-%m-%d %H:%M')"
              echo "分支 $br 内容有更新"
            else
              git commit -q --allow-empty -m "sync $br $(date -u +'%Y-%m-%d %H:%M') (no changes)"
              echo "分支 $br 内容无变化，已生成空提交"
            fi
            git push origin "$br"
          }

          # ------------------------------------------------------------
          # 合并去重工具
          # ------------------------------------------------------------

          # reduce.py：域名规则精简的核心逻辑，由 merge_rulesets（多合一）和 optimize_dir（单个精简）共用
          # 用法：reduce.py <merge|single> <输出.json> <输入1.json> [输入2.json ...]
          #   merge ：合并所有输入，总是生成输出
          #   single：精简单个规则集；没有可精简的内容时以退出码 3 结束（调用方保持原文件不动），
          #           有精简时生成输出，并在标准输出打印 "精简前条目数<TAB>精简后条目数"
          # 精简规则（只处理纯域名规则：domain / domain_suffix / domain_keyword / domain_regex）：
          #   0. 精确 domain "x" 加带点后缀 ".x"（只匹配子域）合起来等价于不带点后缀 "x"，合并成一条
          #   1. domain_suffix 的 "x.com" 已覆盖 x.com 及所有子域，所以 a.x.com 可以删
          #   2. 精确 domain 被某个 suffix 覆盖的删掉
          #   3. 被 domain_keyword 命中的 suffix/domain 删掉
          #   4. 含其他字段（如 ip_cidr）的规则原样保留，不参与精简
          # 内置自检：对每个原始条目构造探测域名，精简前后的匹配结果必须完全一致，否则报错退出
          cat > "$WORK/reduce.py" <<'PY'
          import json, sys

          mode, out, ins = sys.argv[1], sys.argv[2], sys.argv[3:]
          KEYS = {"domain", "domain_suffix", "domain_keyword", "domain_regex"}

          def lst(v):
              # sing-box 允许把字段写成单个字符串
              return [v] if isinstance(v, str) else list(v)

          ver = 1
          suf, dom, kw, rx, other, seen = set(), set(), set(), set(), [], set()
          raw = n_dr = 0   # raw：精简前的条目总数（含重复）；n_dr：纯域名规则的条数

          for p in ins:
              d = json.load(open(p, encoding="utf-8"))
              ver = max(ver, d.get("version", 1))
              for r in d.get("rules", []):
                  r = {k: v for k, v in r.items() if not (k == "type" and v == "default")}
                  if r and set(r) <= KEYS:
                      n_dr += 1
                      raw += sum(len(lst(v)) for v in r.values())
                      dom.update(x.strip().lower() for x in lst(r.get("domain", [])))
                      suf.update(x.strip().lower() for x in lst(r.get("domain_suffix", [])))
                      kw.update(x.strip() for x in lst(r.get("domain_keyword", [])))
                      rx.update(x.strip() for x in lst(r.get("domain_regex", [])))
                  else:
                      s = json.dumps(r, sort_keys=True, ensure_ascii=False)
                      if s not in seen:
                          seen.add(s)
                          other.append(r)

          dom.discard(""); suf.discard(""); suf.discard("."); kw.discard(""); rx.discard("")
          dom0, suf0 = set(dom), set(suf)
          n0 = (len(suf), len(dom), len(kw), len(rx))

          # 第一步：精确 domain "x" + 带点后缀 ".x" -> 不带点后缀 "x"
          for x in [x for x in dom if "." + x in suf]:
              dom.discard(x); suf.discard("." + x); suf.add(x)

          def parents(d):
              p = d.split(".")
              for i in range(1, len(p)):
                  yield ".".join(p[i:])

          # 不带点 "x.com" 匹配 x.com 及其所有子域；带点 ".x.com" 只匹配子域
          def suf_covered(d, S):
              d0 = d.lstrip(".")
              if d.startswith(".") and d0 in S:
                  return True
              return any(a in S or "." + a in S for a in parents(d0))

          def dom_covered(d, S):
              return d in S or any(a in S or "." + a in S for a in parents(d))

          kws = sorted(kw)
          def kw_covered(d):
              return any(k in d for k in kws)

          suf_r = {d for d in suf if not suf_covered(d, suf) and not kw_covered(d)}
          dom_r = {d for d in dom if not dom_covered(d, suf) and not kw_covered(d)}
          after = len(suf_r) + len(dom_r) + len(kw) + len(rx)

          # single 模式：没有域名规则或没有任何精简时，保持原文件不动
          if mode == "single" and (n_dr == 0 or after >= raw):
              sys.exit(3)

          # 自检：用原始条目构造探测域名（条目本身、条目的一个子域），比较精简前后的匹配结果
          def match(h, D, S):
              if h in D or h in S or any(k in h for k in kws):
                  return True
              p = h
              while "." in p:
                  p = p.split(".", 1)[1]
                  if p in S or "." + p in S:
                      return True
              return False

          for e in dom0 | suf0:
              e0 = e.lstrip(".")
              for h in (e0, "probe-x." + e0):
                  if match(h, dom0, suf0) != match(h, dom_r, suf_r):
                      sys.exit("自检失败：%s 的匹配结果在精简前后不一致（条目 %s）" % (h, e))

          m = {}
          if dom_r: m["domain"] = sorted(dom_r)
          if suf_r: m["domain_suffix"] = sorted(suf_r)
          if kw:    m["domain_keyword"] = kws
          if rx:    m["domain_regex"] = sorted(rx)
          rules = ([m] if m else []) + other
          if not rules:
              sys.exit("合并结果为空")

          with open(out, "w", encoding="utf-8") as f:   # 每个 rule 对象单独一行
              f.write('{"version":%d,"rules":[\n' % ver)
              f.write(",\n".join(json.dumps(r, ensure_ascii=False, separators=(",", ":")) for r in rules))
              f.write("\n]}\n")

          if mode == "single":
              print("%d\t%d" % (raw, after))
          else:
              print("合并前 suffix/domain/keyword/regex = %s，合并后 = %s" % (n0, (len(suf_r), len(dom_r), len(kw), len(rx))))
          PY

          # opt_one.sh：精简若干个规则集文件（原地替换），由 optimize_dir 通过 xargs 并行调用
          # 依赖环境变量：SB（sing-box 路径）、REDUCE（reduce.py 路径）
          # 每个文件输出一行结果（制表符分隔）：
          #   OK  <精简前条目数> <精简后条目数> <文件名>
          #   SKIP <文件名>             没有可精简的内容（ip 规则集等），保持原样
          #   FAIL <文件名> <原因>       出错，保持原样
          cat > "$WORK/opt_one.sh" <<'SH'
          T="$(mktemp -d)"
          trap 'rm -rf "$T"' EXIT
          for f in "$@"; do
            name="$(basename "$f")"
            rm -f "$T"/*
            src="$f"
            if [[ "$f" == *.srs ]]; then
              if ! "$SB" rule-set decompile "$f" -o "$T/in.json" >/dev/null 2>&1; then
                printf 'FAIL\t%s\t反编译失败\n' "$name"; continue
              fi
              src="$T/in.json"
            fi
            rc=0
            st="$(python3 "$REDUCE" single "$T/out.json" "$src" 2>"$T/err")" || rc=$?
            if [ "$rc" = 3 ]; then
              printf 'SKIP\t%s\n' "$name"; continue
            fi
            if [ "$rc" != 0 ]; then
              printf 'FAIL\t%s\t%s\n' "$name" "$(tail -n 1 "$T/err" | tr '\t\n' '  ')"; continue
            fi
            if [[ "$f" == *.srs ]]; then
              if ! "$SB" rule-set compile "$T/out.json" -o "$T/out.srs" >/dev/null 2>&1 || [ ! -s "$T/out.srs" ]; then
                printf 'FAIL\t%s\t编译失败\n' "$name"; continue
              fi
              cp "$T/out.srs" "$f"
            else
              cp "$T/out.json" "$f"
            fi
            printf 'OK\t%s\t%s\n' "$st" "$name"
          done
          SH

          # install_singbox：下载 SagerNet 最新稳定版 sing-box，路径放在全局变量 SB
          # 用 releases/latest，只会取稳定版，不会取 alpha/beta
          # 已经安装过就直接返回（optimize_dir 和 adall 合并都会调用）
          install_singbox() {
            local tag ver
            if [ -n "${SB:-}" ] && [ -x "$SB" ]; then return 0; fi
            tag="$(gh api repos/SagerNet/sing-box/releases/latest --jq .tag_name)" || return 1
            ver="${tag#v}"
            mkdir -p "$WORK/sb"
            gh release download "$tag" --repo SagerNet/sing-box \
              --pattern "sing-box-${ver}-linux-amd64.tar.gz" --dir "$WORK/sb" || return 1
            tar -xzf "$WORK/sb/sing-box-${ver}-linux-amd64.tar.gz" -C "$WORK/sb" || return 1
            SB="$WORK/sb/sing-box-${ver}-linux-amd64/sing-box"
            echo "合并使用 sing-box $tag"
          }

          # optimize_dir <目录> <标签>
          # 对目录里的每个 .srs / .json 规则集做域名精简（并行处理），原地替换：
          #   - 精确 domain "x" + 带点后缀 ".x" 合并成不带点后缀 "x"，并去掉冗余条目（规则见 reduce.py）
          #   - 不含域名规则的（ip 规则集等）和没有可精简内容的，保持原文件不动
          #   - 单个文件出错只警告并保持原样，不影响其他文件；sing-box 装不上则整体跳过，不影响同步
          optimize_dir() {
            local dir="$1" label="$2" log="$WORK/opt-$2.log"
            if ! install_singbox; then
              echo "::warning::sing-box 安装失败，$label 分支的规则集保持原样（未做合并优化）"
              return 0
            fi
            : > "$log"
            find "$dir" -type f \( -name '*.srs' -o -name '*.json' \) -print0 \
              | SB="$SB" REDUCE="$WORK/reduce.py" xargs -0 -r -n 16 -P "$(nproc)" bash "$WORK/opt_one.sh" > "$log" || true
            awk -F'\t' -v label="$label" '
              $1 == "OK"   { ok++; b += $2; a += $3 }
              $1 == "SKIP" { skip++ }
              $1 == "FAIL" { fail++; if (fail <= 10) print "::warning::合并优化失败，已保留原文件：" $2 "（" $3 "）" }
              END { printf "分支 %s 域名规则集合并优化：精简 %d 个，无需精简 %d 个，失败 %d 个；域名条目 %d -> %d\n", label, ok, skip, fail, b, a }
            ' "$log"
          }

          # merge_rulesets <目标目录> <输出名> <输入1> [输入2 ...]
          # 输入可以是 .srs（会先反编译）或 .json（源码格式，直接使用）
          # 反编译所有输入 -> 合并去重 -> 去掉冗余条目 -> 编译，生成 <输出名>.srs 和 <输出名>.json
          # 去冗余规则见 reduce.py 的说明（含 domain + .suffix 配对合并）
          merge_rulesets() {
            local dest="$1" out="$2" tmp f i=0; shift 2
            local jsons=()
            tmp="$WORK/merge-$out"; rm -rf "$tmp"; mkdir -p "$tmp"
            for f in "$@"; do
              if [ ! -f "$f" ]; then echo "::warning::合并 $out 缺少输入文件：$(basename "$f")"; return 1; fi
              i=$((i + 1))
              case "$f" in
                *.json) cp "$f" "$tmp/in$i.json" || return 1 ;;
                *)      "$SB" rule-set decompile "$f" -o "$tmp/in$i.json" || return 1 ;;
              esac
              jsons+=("$tmp/in$i.json")
            done
            python3 "$WORK/reduce.py" merge "$tmp/$out.json" "${jsons[@]}" || return 1
            "$SB" rule-set compile "$tmp/$out.json" -o "$tmp/$out.srs" || return 1
            put "$tmp/$out.json" "$dest/$out.json"
            put "$tmp/$out.srs"  "$dest/$out.srs"
          }

          # split_adrules <源.srs> <临时目录>
          # 把同时含域名和 ip 的规则集拆成两份，输出到临时目录：
          #   adrules-domain.json：域名部分（domain / suffix / keyword / regex 及其他非 ip 字段）
          #   adipall.json：全部 ip_cidr，含 domain 字段里写成 IP 字面量的条目（按 /32 或 /128 处理），
          #                 去重并合并相邻网段；源里没有 ip 规则时不生成这个文件
          split_adrules() {
            local src="$1" tmp="$2"
            "$SB" rule-set decompile "$src" -o "$tmp/src.json" || return 1
            python3 - "$tmp/src.json" "$tmp/adrules-domain.json" "$tmp/adipall.json" <<'PY' || return 1
          import ipaddress, json, sys

          src, dom_out, ip_out = sys.argv[1:4]
          d = json.load(open(src, encoding="utf-8"))
          ver = d.get("version", 1)
          nets, dom_rules = set(), []

          for r in d.get("rules", []):
              r = dict(r)
              for c in r.pop("ip_cidr", []):
                  try:
                      nets.add(ipaddress.ip_network(c.strip(), strict=False))
                  except ValueError:
                      sys.exit("无法解析的 ip_cidr：" + c)
              if "domain" in r:
                  keep = []
                  for x in r["domain"]:
                      try:
                          nets.add(ipaddress.ip_network(x.strip()))   # IP 字面量当作 /32 或 /128
                      except ValueError:
                          keep.append(x)
                  if keep:
                      r["domain"] = keep
                  else:
                      del r["domain"]
              if r:
                  dom_rules.append(r)

          def dump(path, rules):
              with open(path, "w", encoding="utf-8") as f:   # 每个 rule 对象单独一行
                  f.write('{"version":%d,"rules":[\n' % ver)
                  f.write(",\n".join(json.dumps(x, ensure_ascii=False, separators=(",", ":")) for x in rules))
                  f.write("\n]}\n")

          dump(dom_out, dom_rules)
          n_ip = 0
          if nets:
              col = []
              for v in (4, 6):
                  col += list(ipaddress.collapse_addresses([n for n in nets if n.version == v]))
              col.sort(key=lambda n: (n.version, n))
              dump(ip_out, [{"ip_cidr": [str(n) for n in col]}])
              n_ip = len(col)
          print("拆分完成：域名部分 %d 条规则，ip_cidr %d 条" % (len(dom_rules), n_ip))
          PY
          }

          # ------------------------------------------------------------
          # 分支 b：DustinWin / sing-box-ruleset
          # 默认会做域名合并优化（OPTIMIZE_B=0 则原样同步）
          # ------------------------------------------------------------
          clone https://github.com/DustinWin/ruleset_geodata.git sing-box-ruleset "$WORK/dw-sb"
          mkdir -p "$WORK/out-b"
          # git archive 导出文件时自动排除 .git 目录
          git -C "$WORK/dw-sb" archive HEAD | tar -x -C "$WORK/out-b"
          if [ "$OPTIMIZE_B" = 1 ]; then optimize_dir "$WORK/out-b" b; fi
          publish_branch b "$WORK/out-b"

          # ------------------------------------------------------------
          # 分支 m：DustinWin / mihomo-ruleset（原样同步，mihomo 格式不涉及合并优化）
          # ------------------------------------------------------------
          clone https://github.com/DustinWin/ruleset_geodata.git mihomo-ruleset "$WORK/dw-mh"
          mkdir -p "$WORK/out-m"
          git -C "$WORK/dw-mh" archive HEAD | tar -x -C "$WORK/out-m"
          publish_branch m "$WORK/out-m"

          # ------------------------------------------------------------
          # 分支 a：SagerNet 的 geosite + geoip（仅 .srs）
          # 命名规则：
          #   geosite-xxx.srs          -> xxx.srs       （特殊项见 RENAME，手动项见 SITE_FIX）
          #   geosite-category-xxx.srs -> xxx.srs       （撞名时 -> xxxall.srs）
          #   geosite-google-xxx.srs   -> xxx.srs       （google-cn 除外；撞名时保留原名并警告）
          #   geosite-xxx-!cn.srs      -> xxx.srs       （撞名时保留原名并警告）
          #   geoip-xxx.srs            -> xxxip.srs     （如 geoip-cn.srs -> cnip.srs）
          # geosite 生成后统一做域名合并优化；geoip 不含域名，不处理
          # ------------------------------------------------------------
          clone https://github.com/SagerNet/sing-geosite.git rule-set "$WORK/sg-site"
          clone https://github.com/SagerNet/sing-geoip.git   rule-set "$WORK/sg-ip"
          mkdir -p "$WORK/out-a"

          # 检查特殊重命名表里的源文件是否都存在，缺失只警告不中断
          for key in "${!RENAME[@]}"; do
            if [ ! -f "$WORK/sg-site/geosite-$key.srs" ]; then
              echo "::warning::上游缺少 geosite-$key.srs"
            fi
          done

          # 第一步：登记已占用名称，并清空缓存
          TAKEN=(); MAPPED=()
          for v in "${RENAME[@]}";   do TAKEN[$v]=1; done   # 特殊表的目标名
          for v in "${SITE_FIX[@]}"; do TAKEN[$v]=1; done   # 手动表的目标名
          for f in "$WORK"/sg-site/geosite-*.srs; do        # 不会被自动改名的域名规则集
            key="$(basename "$f" .srs)"; key="${key#geosite-}"
            if ! is_plain "$key"; then continue; fi
            if [ -n "${RENAME[$key]:-}" ]; then continue; fi     # 已被改名，原名不再占用
            if [ -n "${SITE_FIX[$key]:-}" ]; then continue; fi
            TAKEN[$key]=1
          done
          for f in "$WORK"/sg-ip/geoip-*.srs; do            # 所有 ip 规则集：<名称>ip
            key="$(basename "$f" .srs)"; key="${key#geoip-}"
            TAKEN[${key}ip]=1
          done

          # 第二步：生成 geosite 文件，并做域名合并优化
          for f in "$WORK"/sg-site/geosite-*.srs; do
            key="$(basename "$f" .srs)"; key="${key#geosite-}"
            site_name "$key" 1
            put "$f" "$WORK/out-a/$SN.srs"
          done
          optimize_dir "$WORK/out-a" a

          # 第三步：生成 geoip 文件，geoip-xxx.srs -> xxxip.srs
          for f in "$WORK"/sg-ip/geoip-*.srs; do
            key="$(basename "$f" .srs)"; key="${key#geoip-}"
            put "$f" "$WORK/out-a/${key}ip.srs"
          done

          echo "分支 a 共 $(ls "$WORK/out-a" | wc -l) 个文件"
          publish_branch a "$WORK/out-a"

          # ------------------------------------------------------------
          # 分支 c：lyc8503/sing-box-rules 两个分支的全部规则文件（.json + .srs）
          #         + DustinWin sing-box-ruleset 的全部规则文件（名称后加 2）
          #         + QuixoticHeart singbox/version5 的全部规则文件（名称后加 3）
          #         + 合并去重生成的 adall（ad + ads2 + adrules 的域名部分）
          #         + 从 adrules 拆出的 ip 规则 adipall（注意：adip 是安道尔 geoip，不能用这个名字）
          # 命名规则：
          #   rule-set-geosite 分支：geosite-xxx.*          -> xxx.*     （手动项见 SITE_FIX）
          #                          geosite-category-xxx.* -> xxx.*     （撞名时 -> xxxall.*）
          #                          geosite-google-xxx.*   -> xxx.*     （google-cn 除外；撞名时保留原名并警告）
          #                          geosite-xxx-!cn.*      -> xxx.*     （撞名时保留原名并警告）
          #   rule-set-geoip   分支：geoip-xxx.*            -> xxxip.*
          #   最后再用 SagerNet 的 geoip-cn.srs 覆盖为 cnip.srs
          #   DustinWin：xxx.srs / xxx.json -> xxx2.srs / xxx2.json（特殊项见 dw_name）
          #   QuixoticHeart：xxx.srs / xxx.json -> xxx3.srs / xxx3.json
          #   adall.srs / adall.json：ad、ads2、adrules 的域名部分合并去重后的结果
          #   adipall.srs / adipall.json：adrules 里的全部 ip 规则
          # 上述文件（adall / adipall 除外，它们由合并工具生成，本身已精简）全部生成后，
          # 统一对域名规则集（.srs 和 .json）做合并优化
          # ------------------------------------------------------------
          clone https://github.com/lyc8503/sing-box-rules.git rule-set-geosite "$WORK/lyc-site"
          clone https://github.com/lyc8503/sing-box-rules.git rule-set-geoip   "$WORK/lyc-ip"
          mkdir -p "$WORK/out-c"

          # 第一步：登记已占用名称（.json 和 .srs 同名，按名称去重登记），并清空缓存
          TAKEN=(); MAPPED=()
          for v in "${SITE_FIX[@]}"; do TAKEN[$v]=1; done
          for f in "$WORK"/lyc-site/geosite-*; do
            name="$(basename "$f")"; name="${name#geosite-}"; stem="${name%.*}"
            if ! is_plain "$stem"; then continue; fi
            if [ -n "${SITE_FIX[$stem]:-}" ]; then continue; fi
            TAKEN[$stem]=1
          done
          for f in "$WORK"/lyc-ip/geoip-*; do
            name="$(basename "$f")"; name="${name#geoip-}"; stem="${name%.*}"
            TAKEN[${stem}ip]=1
          done
          TAKEN[cnip]=1   # 下面会用 SagerNet 的文件生成 cnip.srs

          # 第二步：geosite 去掉 geosite- 前缀，扩展名保持不变；不使用 RENAME 表
          for f in "$WORK"/lyc-site/geosite-*; do
            name="$(basename "$f")"; name="${name#geosite-}"
            ext="${name##*.}"; stem="${name%.*}"
            site_name "$stem" 0
            put "$f" "$WORK/out-c/${SN}.${ext}"
          done

          # 第三步：geoip-ad.json -> adip.json，先拆出名称和扩展名再拼接
          for f in "$WORK"/lyc-ip/geoip-*; do
            name="$(basename "$f")"; name="${name#geoip-}"
            ext="${name##*.}"; stem="${name%.*}"
            put "$f" "$WORK/out-c/${stem}ip.${ext}"
          done

          # cnip.srs 使用 SagerNet 的 geoip-cn.srs
          # 这里直接用 cp：如果 lyc 的 geoip 分支里也有 cn，会被有意覆盖，不需要警告
          cp "$WORK/sg-ip/geoip-cn.srs" "$WORK/out-c/cnip.srs"

          # 第四步：DustinWin 的 sing-box 规则集（复用分支 b 已克隆的 dw-sb）
          # 只取 .srs / .json，名称后加 2：cn.srs -> cn2.srs（特殊项见 dw_name）
          dw_count=0
          while IFS= read -r -d '' f; do
            name="$(basename "$f")"
            case "$name" in *.srs|*.json) ;; *) continue ;; esac
            ext="${name##*.}"; stem="${name%.*}"
            dw_name "$stem"
            put "$f" "$WORK/out-c/${DN}.${ext}"
            dw_count=$((dw_count + 1))
          done < <(find "$WORK/dw-sb" -path "$WORK/dw-sb/.git" -prune -o -type f -print0)
          echo "DustinWin 规则文件已加入 c 分支：$dw_count 个"

          # 第五步：QuixoticHeart / rule-set 的 singbox/version5 全部规则文件（名称后加 3）
          # 只取 .srs / .json：cn.srs -> cn3.srs，cn.json -> cn3.json
          # 克隆或目录检查失败会直接中断，此时 c 分支不会被改动，保留上一次的内容
          QH_DIR="$WORK/qh/singbox/version5"
          git clone -q --depth 1 --branch ruleset --filter=blob:none --sparse \
            https://github.com/QuixoticHeart/rule-set.git "$WORK/qh"
          git -C "$WORK/qh" sparse-checkout set singbox/version5
          if [ ! -d "$QH_DIR" ] || [ -z "$(ls -A "$QH_DIR")" ]; then
            echo "::error::QuixoticHeart 的 singbox/version5 目录不存在或为空，已中断，c 分支保持不变"
            exit 1
          fi
          qh_count=0
          for f in "$QH_DIR"/*; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            case "$name" in *.srs|*.json) ;; *) continue ;; esac
            ext="${name##*.}"; stem="${name%.*}"
            put "$f" "$WORK/out-c/${stem}3.${ext}"
            qh_count=$((qh_count + 1))
          done
          echo "QuixoticHeart 规则文件已加入 c 分支：$qh_count 个"

          # 第五步半：对 c 分支目前所有的域名规则集（.srs 和 .json）做合并优化
          # 放在 adall 之前，这样下面合并用到的 ad.srs / ads2.srs 已经是精简过的
          optimize_dir "$WORK/out-c" c

          # 第六步：处理 adrules（同步自 QuixoticHeart）
          #   1. 拆成域名部分和 ip 部分
          #   2. 域名部分与 ad（lyc 的 category-ads-all）、ads2（DustinWin 的 ads）合并去重 -> adall
          #   3. ip 部分单独编译 -> adipall
          # 任何一步失败都不中断同步，而是沿用远端 c 分支上一次的版本
          ADTMP="$WORK/adrules-split"; rm -rf "$ADTMP"; mkdir -p "$ADTMP"
          if install_singbox && split_adrules "$QH_DIR/adrules.srs" "$ADTMP"; then
            if merge_rulesets "$WORK/out-c" adall "$WORK/out-c/ad.srs" "$WORK/out-c/ads2.srs" "$ADTMP/adrules-domain.json"; then
              echo "adall 合并完成"
            else
              echo "::warning::adall 合并失败，沿用远端 c 分支上一次的版本"
              keep_old adall
            fi
            if [ ! -f "$ADTMP/adipall.json" ]; then
              echo "::warning::adrules 里没有 ip 规则，本次不生成 adipall"
            elif "$SB" rule-set compile "$ADTMP/adipall.json" -o "$ADTMP/adipall.srs"; then
              put "$ADTMP/adipall.json" "$WORK/out-c/adipall.json"
              put "$ADTMP/adipall.srs"  "$WORK/out-c/adipall.srs"
              echo "adipall 生成完成"
            else
              echo "::warning::adipall 编译失败，沿用远端 c 分支上一次的版本"
              keep_old adipall
            fi
          else
            echo "::warning::adrules 拆分失败，adall 和 adipall 沿用远端 c 分支上一次的版本"
            keep_old adall
            keep_old adipall
          fi

          echo "分支 c 共 $(ls "$WORK/out-c" | wc -l) 个文件"
          publish_branch c "$WORK/out-c"

      # 保活：公共仓库 60 天无活动会被自动停用定时任务，这里定期重置计时
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable "${{ github.workflow }}" --repo "${{ github.repository }}" || true
