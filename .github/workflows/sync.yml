name: Sync Upstream Ruleset

on:
  schedule:
    - cron: '17 20 * * *'   # UTC 20:17 = 北京时间 04:17，错开整点拥堵
  workflow_dispatch:

# contents: 向自己的仓库推送分支；actions: 保活步骤需要
permissions:
  contents: write
  actions: write

# 防止上一次还没跑完、下一次又触发，导致两次推送互相冲突
concurrency:
  group: sync-upstream-ruleset
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7   # 当前最新大版本，使用 Node.js 24
        with:
          fetch-depth: 0

      - name: Sync from Upstream
        env:
          GH_TOKEN: ${{ github.token }}   # install_singbox / install_mihomo 用 gh 下载需要
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 所有临时文件放在 RUNNER_TEMP，不会污染仓库工作区
          WORK="$RUNNER_TEMP/work"
          rm -rf "$WORK" && mkdir -p "$WORK"

          # ------------------------------------------------------------
          # 开关
          # ------------------------------------------------------------

          # 是否对 b 分支（DustinWin 的 sing-box 规则集，原本是原样同步）也做域名合并优化：1 = 做，0 = 保持原样
          # a、c 分支的域名规则集始终会做合并优化；m 分支由 c 分支的 json 转换而来，不单独做优化
          OPTIMIZE_B=1

          # ------------------------------------------------------------
          # 命名规则表
          # ------------------------------------------------------------

          # 【手动改名表】a、c 两个分支共用，优先级最高（高于 RENAME 和自动规则）
          # 键是去掉 geosite- 前缀后的原始名称，值是最终名称。
          # 用途一：域名规则集名字等于 "<国家代码>ip" 时，避免与 ip 规则集撞名
          #         （geosite-noip 与 geoip-no 的 noip）。
          # 用途二：特殊规则集单独命名（category-ads-all -> ad）。
          # 用途三：两个规则集自动改名后会变成同一个名字时，手动给其中一个指定名字。
          #   - google-scholar 去前缀会与 category-scholar-!cn 撞名（都是 scholar），
          #     后者是更大的国外学术合集，占用 scholar，前者手动命名为 googlescholar。
          #   - games：上游有 category-games（国内外合集）、category-games-cn（国内）、
          #     category-games-!cn（国外）。国外版按规则变成 games，国内版是 games-cn，
          #     合集版手动命名为 gamesall（含 @ads / @cn / @telemetry 属性版本）。
          # 以后日志里出现撞名警告，在这里加一行即可：[原名]=新名
          declare -A SITE_FIX=(
            [noip]=noipsite
            [google-scholar]=googlescholar
            [category-ads-all]=ad
            [category-games]=gamesall
            [category-games@ads]=gamesall@ads
            [category-games@cn]=gamesall@cn
            [category-games@telemetry]=gamesall@telemetry
          )

          # 【按基础名改名表】a、c 两个分支共用，优先级仅次于 SITE_FIX
          # 键是去掉 geosite- 前缀、并去掉 @属性 之后的名称，值是新的基础名；
          # @属性 部分自动保留，所以 category-cryptocurrency@cn 会变成 crypto@cn，不用逐个列出。
          #   - category-cryptocurrency -> crypto
          #   - geolocation-cn          -> geo-cn
          #   - geolocation-!cn         -> proxy
          #                                c 分支里还会把 DustinWin 的 proxy2、QuixoticHeart 的 proxy3 合并进来
          #   - china-list              -> cnall（只有 lyc 有这个规则集）
          declare -A BASE_FIX=(
            [category-cryptocurrency]=crypto
            [geolocation-cn]=geo-cn
            [geolocation-!cn]=proxy
            [china-list]=cnall
          )

          # 【c 分支的合并规则】仅 c 分支使用，写的都是 c 分支里最终的名称
          # 合并成功后，被合并的原文件从 c 分支删除；合并失败则保持原样，不删除

          # 指定并入 adall 的规则集，和 ad、ads2、adrules 的域名部分一起合并
          # 这里的名称优先于下面的后缀规则：即使以 @cn 结尾（如 telemetry@cn），也并入 adall 而不是 cnall
          AD_EXTRA=(
            telemetry telemetry@ads telemetry@cn telemetry@telemetry
            ads@ads ads@telemetry
            ads-and-telemetry ads-and-telemetry@ads ads-and-telemetry@cn ads-and-telemetry@telemetry
          )

          # 名称以这些结尾的规则集，全部并入 adall
          AD_SUFFIX=(@ads @telemetry)

          # 额外并入 adall 的 domain_suffix（不带点：匹配该域名本身及所有子域）
          AD_EXTRA_SUFFIX=(push-ads-cn.heytapmobi.com)

          # 名称以这些结尾的规则集，全部并入 cnall（上面 AD_EXTRA 里的除外）
          CN_SUFFIX=(@cn)

          # 【特殊重命名表】仅 a 分支使用：geosite-<键>.srs -> <值>.srs
          # 优先级高于自动改名规则
          # （google-play、google-gemini 等已由 "去 google- 前缀" 的通用规则覆盖，无需再列）
          declare -A RENAME=(
            [category-media]=media
          )

          # 【已占用名称表】用来判断自动改名后会不会和现有名称撞名
          # 每个分支生成文件前会重新填充
          declare -A TAKEN=()

          # 【命名缓存】同一个规则集的 .json 和 .srs 只计算一次，日志也只提示一次
          # 每个分支生成文件前会清空
          declare -A MAPPED=()

          # ------------------------------------------------------------
          # 工具函数
          # ------------------------------------------------------------

          # clone <仓库地址> <分支> <目标目录>：浅克隆上游指定分支
          clone() { git clone -q --depth 1 --branch "$2" "$1" "$3"; }

          # put <源文件> <目标文件>：复制文件，目标已存在时给出警告（说明发生了重名覆盖）
          put() {
            if [ -e "$2" ]; then
              echo "::warning::重名覆盖：$(basename "$2")"
            fi
            cp "$1" "$2"
          }

          # keep_old <名称>：合并/生成失败时，沿用远端 c 分支上一次的 <名称>.srs 和 <名称>.json
          # （publish_branch 会先清空分支，不沿用的话这一天该规则集就会消失）
          keep_old() {
            local ext
            for ext in srs json; do
              if git cat-file -e "origin/c:$1.$ext" 2>/dev/null; then
                git show "origin/c:$1.$ext" > "$WORK/out-c/$1.$ext"
              fi
            done
          }

          # is_plain <域名规则集原名>：返回 0 表示 "不会被自动改名"（名称保持原样）
          # 自动改名的三种情况（@ 属性部分不参与判断）：
          #   1. 以 category- 开头
          #   2. 以 google- 开头（google-cn 除外）
          #   3. 主体部分以 -!cn 结尾
          is_plain() {
            local k="$1" b="${1%%@*}"
            if [[ "$k" == category-?* ]]; then return 1; fi
            if [[ "$b" == google-?* && "$b" != "google-cn" ]]; then return 1; fi
            if [[ "$b" == *"-!cn" ]]; then return 1; fi
            return 0
          }

          # is_fixed <域名规则集原名>：返回 0 表示 "已被 SITE_FIX / BASE_FIX 手动改名"，原名不再占用
          is_fixed() {
            local b="${1%%@*}"
            [ -n "${SITE_FIX[$1]:-}" ] || [ -n "${BASE_FIX[$b]:-}" ]
          }

          # _site_calc <域名规则集名> <是否使用RENAME表：1/0>
          # 实际计算最终名称，结果放在全局变量 SN 里
          # （不用 echo 返回，是为了让日志提示能直接输出到 Actions 日志）
          # 优先级：SITE_FIX > BASE_FIX > RENAME > 自动规则（去 category-、去 google-、去 -!cn）> 原名
          # 自动规则撞名时：
          #   - 只去了 category-：改为在名称后加 all（xxxall）
          #   - 去了 google- 或 -!cn：含义不同，不自动合并，保留原名并警告
          _site_calc() {
            local k="$1" use_rename="$2" s base attr cand alt kb had_cat=0 had_ncn=0 had_g=0
            if [ -n "${SITE_FIX[$k]:-}" ]; then
              SN="${SITE_FIX[$k]}"; return
            fi
            kb="${k%%@*}"                            # 按基础名改名：@属性 自动保留
            if [ -n "${BASE_FIX[$kb]:-}" ]; then
              SN="${BASE_FIX[$kb]}${k#"$kb"}"; return
            fi
            if [ "$use_rename" = 1 ] && [ -n "${RENAME[$k]:-}" ]; then
              SN="${RENAME[$k]}"; return
            fi

            s="$k"
            if [[ "$k" == category-?* ]]; then
              s="${k#category-}"; had_cat=1
            fi
            base="${s%%@*}"; attr="${s#"$base"}"     # 拆出主体和 @属性
            if [[ "$base" == google-?* && "$base" != "google-cn" ]]; then
              base="${base#google-}"; had_g=1        # 去掉 google- 前缀（google-cn 除外）
            fi
            if [[ "$base" == *"-!cn" && -n "${base%"-!cn"}" ]]; then
              base="${base%"-!cn"}"; had_ncn=1       # 去掉 -!cn 后缀
            fi

            # 没有任何需要改的地方：保持原名
            if [ "$had_cat" = 0 ] && [ "$had_ncn" = 0 ] && [ "$had_g" = 0 ]; then
              SN="$k"; return
            fi

            cand="${base}${attr}"
            if [ -z "${TAKEN[$cand]:-}" ]; then
              SN="$cand"; return
            fi

            # 以下是撞名的处理
            if [ "$had_ncn" = 1 ] || [ "$had_g" = 1 ]; then
              echo "::warning::$k 自动改名会与已有的 $cand 撞名，已保留原名（可在 SITE_FIX 里手动指定）"
              SN="$k"; return
            fi
            alt="${base}all${attr}"
            if [ -z "${TAKEN[$alt]:-}" ]; then
              echo "::notice::$k 去前缀会与 $cand 撞名，已命名为 $alt"
              SN="$alt"
            else
              echo "::warning::$k 去前缀与加 all 均撞名，已保留原名"
              SN="$k"
            fi
          }

          # site_name <域名规则集名> <是否使用RENAME表：1/0>：带缓存的包装
          site_name() {
            if [ -n "${MAPPED[$1]:-}" ]; then
              SN="${MAPPED[$1]}"
            else
              _site_calc "$1" "$2"
              MAPPED[$1]="$SN"
            fi
          }

          # dw_name <DustinWin 规则集名>：结果放在全局变量 DN 里
          # 默认在名称后加 2（cn -> cn2）；加 2 后与已有名称撞名的，在 case 里手动指定
          #   - bilibili 加 2 会与 lyc 的 bilibili2（geosite-bilibili2）撞名，
          #     lyc 的保持原名，DustinWin 的命名为 bilibili22
          dw_name() {
            case "$1" in
              bilibili) DN="bilibili22" ;;
              *)        DN="${1}2" ;;
            esac
          }

          # publish_branch <分支名> <源目录>
          # 把源目录的内容发布到自己仓库的指定分支：
          #   - 不强推，历史保留
          #   - 先清空分支再放入新文件，所以上游删除的文件也会同步删除
          #   - 无论内容有无变化都提交并推送（无变化时为空提交），每次运行都留下同步记录
          publish_branch() {
            local br="$1" src="$2"

            # 保护：源目录为空时直接报错跳过，避免把分支清空后提交
            if [ -z "$(ls -A "$src")" ]; then
              echo "::error::$br 的源目录为空，已跳过"
              return 1
            fi

            # 远端已有该分支就基于它继续；没有就新建孤儿分支（无历史）
            if git ls-remote --exit-code --heads origin "$br" >/dev/null 2>&1; then
              git fetch -q origin "$br"
              git checkout -q -f -B "$br" "origin/$br"
            else
              git checkout -q --orphan "$br"
            fi

            # 清空旧内容，再放入新内容
            git rm -rf . -q 2>/dev/null || true
            git clean -fdxq
            cp -a "$src"/. .

            # 强制提交：--allow-empty 保证没有差异时也会生成一条提交
            git add -A
            if [ -n "$(git status --porcelain)" ]; then
              git commit -q -m "sync $br $(date -u +'%Y-%m-%d %H:%M')"
              echo "分支 $br 内容有更新"
            else
              git commit -q --allow-empty -m "sync $br $(date -u +'%Y-%m-%d %H:%M') (no changes)"
              echo "分支 $br 内容无变化，已生成空提交"
            fi
            git push origin "$br"
          }

          # ------------------------------------------------------------
          # 合并去重工具
          # ------------------------------------------------------------

          # reduce.py：域名规则精简的核心逻辑，由 merge_rulesets（多合一）和 optimize_dir（单个精简）共用
          # 用法：reduce.py <merge|single> <输出.json> <输入1.json> [输入2.json ...]
          #   merge ：合并所有输入，总是生成输出
          #   single：精简单个规则集；没有可精简的内容时以退出码 3 结束（调用方保持原文件不动），
          #           有精简时生成输出，并在标准输出打印 "精简前条目数<TAB>精简后条目数"
          # 精简规则（只处理纯域名规则：domain / domain_suffix / domain_keyword / domain_regex）：
          #   0. 精确 domain "x" 加带点后缀 ".x"（只匹配子域）合起来等价于不带点后缀 "x"，合并成一条
          #   1. domain_suffix 的 "x.com" 已覆盖 x.com 及所有子域，所以 a.x.com 可以删
          #   2. 精确 domain 被某个 suffix 覆盖的删掉
          #   3. 被 domain_keyword 命中的 suffix/domain 删掉
          #   4. 含其他字段（如 ip_cidr）的规则原样保留，不参与精简
          # 内置自检：对每个原始条目构造探测域名，精简前后的匹配结果必须完全一致，否则报错退出
          cat > "$WORK/reduce.py" <<'PY'
          import json, sys

          mode, out, ins = sys.argv[1], sys.argv[2], sys.argv[3:]
          KEYS = {"domain", "domain_suffix", "domain_keyword", "domain_regex"}

          def lst(v):
              # sing-box 允许把字段写成单个字符串
              return [v] if isinstance(v, str) else list(v)

          ver = 1
          suf, dom, kw, rx, other, seen = set(), set(), set(), set(), [], set()
          raw = n_dr = 0   # raw：精简前的条目总数（含重复）；n_dr：纯域名规则的条数

          for p in ins:
              d = json.load(open(p, encoding="utf-8"))
              ver = max(ver, d.get("version", 1))
              for r in d.get("rules", []):
                  r = {k: v for k, v in r.items() if not (k == "type" and v == "default")}
                  if r and set(r) <= KEYS:
                      n_dr += 1
                      raw += sum(len(lst(v)) for v in r.values())
                      dom.update(x.strip().lower() for x in lst(r.get("domain", [])))
                      suf.update(x.strip().lower() for x in lst(r.get("domain_suffix", [])))
                      kw.update(x.strip() for x in lst(r.get("domain_keyword", [])))
                      rx.update(x.strip() for x in lst(r.get("domain_regex", [])))
                  else:
                      s = json.dumps(r, sort_keys=True, ensure_ascii=False)
                      if s not in seen:
                          seen.add(s)
                          other.append(r)

          dom.discard(""); suf.discard(""); suf.discard("."); kw.discard(""); rx.discard("")
          dom0, suf0 = set(dom), set(suf)
          n0 = (len(suf), len(dom), len(kw), len(rx))

          # 第一步：精确 domain "x" + 带点后缀 ".x" -> 不带点后缀 "x"
          for x in [x for x in dom if "." + x in suf]:
              dom.discard(x); suf.discard("." + x); suf.add(x)

          def parents(d):
              p = d.split(".")
              for i in range(1, len(p)):
                  yield ".".join(p[i:])

          # 不带点 "x.com" 匹配 x.com 及其所有子域；带点 ".x.com" 只匹配子域
          def suf_covered(d, S):
              d0 = d.lstrip(".")
              if d.startswith(".") and d0 in S:
                  return True
              return any(a in S or "." + a in S for a in parents(d0))

          def dom_covered(d, S):
              return d in S or any(a in S or "." + a in S for a in parents(d))

          kws = sorted(kw)
          def kw_covered(d):
              return any(k in d for k in kws)

          suf_r = {d for d in suf if not suf_covered(d, suf) and not kw_covered(d)}
          dom_r = {d for d in dom if not dom_covered(d, suf) and not kw_covered(d)}
          after = len(suf_r) + len(dom_r) + len(kw) + len(rx)

          # single 模式：没有域名规则或没有任何精简时，保持原文件不动
          if mode == "single" and (n_dr == 0 or after >= raw):
              sys.exit(3)

          # 自检：用原始条目构造探测域名（条目本身、条目的一个子域），比较精简前后的匹配结果
          def match(h, D, S):
              if h in D or h in S or any(k in h for k in kws):
                  return True
              p = h
              while "." in p:
                  p = p.split(".", 1)[1]
                  if p in S or "." + p in S:
                      return True
              return False

          for e in dom0 | suf0:
              e0 = e.lstrip(".")
              for h in (e0, "probe-x." + e0):
                  if match(h, dom0, suf0) != match(h, dom_r, suf_r):
                      sys.exit("自检失败：%s 的匹配结果在精简前后不一致（条目 %s）" % (h, e))

          m = {}
          if dom_r: m["domain"] = sorted(dom_r)
          if suf_r: m["domain_suffix"] = sorted(suf_r)
          if kw:    m["domain_keyword"] = kws
          if rx:    m["domain_regex"] = sorted(rx)
          rules = ([m] if m else []) + other
          if not rules:
              sys.exit("合并结果为空")

          with open(out, "w", encoding="utf-8") as f:   # 每个 rule 对象单独一行
              f.write('{"version":%d,"rules":[\n' % ver)
              f.write(",\n".join(json.dumps(r, ensure_ascii=False, separators=(",", ":")) for r in rules))
              f.write("\n]}\n")

          if mode == "single":
              print("%d\t%d" % (raw, after))
          else:
              print("合并前 suffix/domain/keyword/regex = %s，合并后 = %s" % (n0, (len(suf_r), len(dom_r), len(kw), len(rx))))
          PY

          # opt_one.sh：精简若干个规则集文件（原地替换），由 optimize_dir 通过 xargs 并行调用
          # 依赖环境变量：SB（sing-box 路径）、REDUCE（reduce.py 路径）
          # 每个文件输出一行结果（制表符分隔）：
          #   OK  <精简前条目数> <精简后条目数> <文件名>
          #   SKIP <文件名>             没有可精简的内容（ip 规则集等），保持原样
          #   FAIL <文件名> <原因>       出错，保持原样
          cat > "$WORK/opt_one.sh" <<'SH'
          T="$(mktemp -d)"
          trap 'rm -rf "$T"' EXIT
          for f in "$@"; do
            name="$(basename "$f")"
            rm -f "$T"/*
            src="$f"
            if [[ "$f" == *.srs ]]; then
              if ! "$SB" rule-set decompile "$f" -o "$T/in.json" >/dev/null 2>&1; then
                printf 'FAIL\t%s\t反编译失败\n' "$name"; continue
              fi
              src="$T/in.json"
            fi
            rc=0
            st="$(python3 "$REDUCE" single "$T/out.json" "$src" 2>"$T/err")" || rc=$?
            if [ "$rc" = 3 ]; then
              printf 'SKIP\t%s\n' "$name"; continue
            fi
            if [ "$rc" != 0 ]; then
              printf 'FAIL\t%s\t%s\n' "$name" "$(tail -n 1 "$T/err" | tr '\t\n' '  ')"; continue
            fi
            if [[ "$f" == *.srs ]]; then
              if ! "$SB" rule-set compile "$T/out.json" -o "$T/out.srs" >/dev/null 2>&1 || [ ! -s "$T/out.srs" ]; then
                printf 'FAIL\t%s\t编译失败\n' "$name"; continue
              fi
              cp "$T/out.srs" "$f"
            else
              cp "$T/out.json" "$f"
            fi
            printf 'OK\t%s\t%s\n' "$st" "$name"
          done
          SH

          # install_singbox：下载 SagerNet 最新稳定版 sing-box，路径放在全局变量 SB
          # 用 releases/latest，只会取稳定版，不会取 alpha/beta
          # 已经安装过就直接返回（optimize_dir 和 adall 合并都会调用）
          install_singbox() {
            local tag ver
            if [ -n "${SB:-}" ] && [ -x "$SB" ]; then return 0; fi
            tag="$(gh api repos/SagerNet/sing-box/releases/latest --jq .tag_name)" || return 1
            ver="${tag#v}"
            mkdir -p "$WORK/sb"
            gh release download "$tag" --repo SagerNet/sing-box \
              --pattern "sing-box-${ver}-linux-amd64.tar.gz" --dir "$WORK/sb" || return 1
            tar -xzf "$WORK/sb/sing-box-${ver}-linux-amd64.tar.gz" -C "$WORK/sb" || return 1
            SB="$WORK/sb/sing-box-${ver}-linux-amd64/sing-box"
            echo "合并使用 sing-box $tag"
          }

          # optimize_dir <目录> <标签>
          # 对目录里的每个 .srs / .json 规则集做域名精简（并行处理），原地替换：
          #   - 精确 domain "x" + 带点后缀 ".x" 合并成不带点后缀 "x"，并去掉冗余条目（规则见 reduce.py）
          #   - 不含域名规则的（ip 规则集等）和没有可精简内容的，保持原文件不动
          #   - 单个文件出错只警告并保持原样，不影响其他文件；sing-box 装不上则整体跳过，不影响同步
          optimize_dir() {
            local dir="$1" label="$2" log="$WORK/opt-$2.log"
            if ! install_singbox; then
              echo "::warning::sing-box 安装失败，$label 分支的规则集保持原样（未做合并优化）"
              return 0
            fi
            : > "$log"
            find "$dir" -type f \( -name '*.srs' -o -name '*.json' \) -print0 \
              | SB="$SB" REDUCE="$WORK/reduce.py" xargs -0 -r -n 16 -P "$(nproc)" bash "$WORK/opt_one.sh" > "$log" || true
            awk -F'\t' -v label="$label" '
              $1 == "OK"   { ok++; b += $2; a += $3 }
              $1 == "SKIP" { skip++ }
              $1 == "FAIL" { fail++; if (fail <= 10) print "::warning::合并优化失败，已保留原文件：" $2 "（" $3 "）" }
              END { printf "分支 %s 域名规则集合并优化：精简 %d 个，无需精简 %d 个，失败 %d 个；域名条目 %d -> %d\n", label, ok, skip, fail, b, a }
            ' "$log"
          }

          # merge_rulesets <目标目录> <输出名> <输入1> [输入2 ...]
          # 输入可以是 .srs（会先反编译）或 .json（源码格式，直接使用）
          # 反编译所有输入 -> 合并去重 -> 去掉冗余条目 -> 编译，生成 <输出名>.srs 和 <输出名>.json
          # 去冗余规则见 reduce.py 的说明（含 domain + .suffix 配对合并）
          merge_rulesets() {
            local dest="$1" out="$2" tmp f i=0; shift 2
            local jsons=()
            tmp="$WORK/merge-$out"; rm -rf "$tmp"; mkdir -p "$tmp"
            for f in "$@"; do
              if [ ! -f "$f" ]; then echo "::warning::合并 $out 缺少输入文件：$(basename "$f")"; return 1; fi
              i=$((i + 1))
              case "$f" in
                *.json) cp "$f" "$tmp/in$i.json" || return 1 ;;
                *)      "$SB" rule-set decompile "$f" -o "$tmp/in$i.json" || return 1 ;;
              esac
              jsons+=("$tmp/in$i.json")
            done
            python3 "$WORK/reduce.py" merge "$tmp/$out.json" "${jsons[@]}" || return 1
            "$SB" rule-set compile "$tmp/$out.json" -o "$tmp/$out.srs" || return 1
            put "$tmp/$out.json" "$dest/$out.json"
            put "$tmp/$out.srs"  "$dest/$out.srs"
          }

          # merge_group <输出名> <输入1> [输入2 ...]
          # 把 c 分支目录（out-c）里的多个规则集合并去重成 <输出名>.srs 和 <输出名>.json（调用 merge_rulesets）
          # 输入有两种写法：
          #   - 普通名称（如 proxy2）：取 out-c 里的 <名称>.srs，没有就取 <名称>.json，都没有则警告并跳过；
          #                            合并成功后，这些输入的原文件会从 out-c 删除（相当于已并入输出）
          #   - 绝对路径（如 "$ADTMP/adrules-domain.json"）：文件必须存在，否则合并失败；合并后不删除
          # 输出名可以和某个普通输入同名（如 proxy 合并 proxy、proxy2、proxy3），此时原文件会被合并结果替换
          # 合并失败时返回 1，out-c 保持原样（任何输入都不会被删除）
          merge_group() {
            local out="$1" c="$WORK/out-c" n tmp inputs=() used=(); shift
            for n in "$@"; do
              case "$n" in
                /*)
                  if [ ! -f "$n" ]; then echo "::warning::合并 $out 缺少输入文件：$(basename "$n")"; return 1; fi
                  inputs+=("$n") ;;
                *)
                  if [ -f "$c/$n.srs" ]; then inputs+=("$c/$n.srs"); used+=("$n")
                  elif [ -f "$c/$n.json" ]; then inputs+=("$c/$n.json"); used+=("$n")
                  else echo "::warning::合并 $out：找不到 $n，已跳过"; fi ;;
              esac
            done
            if [ "${#inputs[@]}" = 0 ]; then return 1; fi
            tmp="$WORK/group-$out"; rm -rf "$tmp"; mkdir -p "$tmp"
            merge_rulesets "$tmp" "$out" "${inputs[@]}" || return 1
            for n in "${used[@]}"; do rm -f "$c/$n.srs" "$c/$n.json"; done
            put "$tmp/$out.json" "$c/$out.json"
            put "$tmp/$out.srs"  "$c/$out.srs"
          }

          # list_by_suffix <后缀1> [后缀2 ...]
          # 列出 c 分支目录（out-c）里名称（去掉 .srs / .json）以任一后缀结尾的规则集，去重（.srs 和 .json 同名只算一个），
          # 结果放在全局数组 LIST 里；AD_EXTRA 里的名称不会列出（它们已经指定并入 adall）
          list_by_suffix() {
            local f name s
            local -A seen=()
            for s in "${AD_EXTRA[@]}"; do seen[$s]=1; done
            LIST=()
            for f in "$WORK"/out-c/*; do
              [ -f "$f" ] || continue
              name="$(basename "$f")"
              case "$name" in *.srs|*.json) name="${name%.*}" ;; *) continue ;; esac
              if [ -n "${seen[$name]:-}" ]; then continue; fi
              for s in "$@"; do
                if [[ "$name" == *"$s" ]]; then
                  seen[$name]=1; LIST+=("$name"); break
                fi
              done
            done
          }

          # split_adrules <源.srs> <临时目录>
          # 把同时含域名和 ip 的规则集拆成两份，输出到临时目录：
          #   adrules-domain.json：域名部分（domain / suffix / keyword / regex 及其他非 ip 字段）
          #   adipall.json：全部 ip_cidr，含 domain 字段里写成 IP 字面量的条目（按 /32 或 /128 处理），
          #                 去重并合并相邻网段；源里没有 ip 规则时不生成这个文件
          split_adrules() {
            local src="$1" tmp="$2"
            "$SB" rule-set decompile "$src" -o "$tmp/src.json" || return 1
            python3 - "$tmp/src.json" "$tmp/adrules-domain.json" "$tmp/adipall.json" <<'PY' || return 1
          import ipaddress, json, sys

          src, dom_out, ip_out = sys.argv[1:4]
          d = json.load(open(src, encoding="utf-8"))
          ver = d.get("version", 1)
          nets, dom_rules = set(), []

          for r in d.get("rules", []):
              r = dict(r)
              for c in r.pop("ip_cidr", []):
                  try:
                      nets.add(ipaddress.ip_network(c.strip(), strict=False))
                  except ValueError:
                      sys.exit("无法解析的 ip_cidr：" + c)
              if "domain" in r:
                  keep = []
                  for x in r["domain"]:
                      try:
                          nets.add(ipaddress.ip_network(x.strip()))   # IP 字面量当作 /32 或 /128
                      except ValueError:
                          keep.append(x)
                  if keep:
                      r["domain"] = keep
                  else:
                      del r["domain"]
              if r:
                  dom_rules.append(r)

          def dump(path, rules):
              with open(path, "w", encoding="utf-8") as f:   # 每个 rule 对象单独一行
                  f.write('{"version":%d,"rules":[\n' % ver)
                  f.write(",\n".join(json.dumps(x, ensure_ascii=False, separators=(",", ":")) for x in rules))
                  f.write("\n]}\n")

          dump(dom_out, dom_rules)
          n_ip = 0
          if nets:
              col = []
              for v in (4, 6):
                  col += list(ipaddress.collapse_addresses([n for n in nets if n.version == v]))
              col.sort(key=lambda n: (n.version, n))
              dump(ip_out, [{"ip_cidr": [str(n) for n in col]}])
              n_ip = len(col)
          print("拆分完成：域名部分 %d 条规则，ip_cidr %d 条" % (len(dom_rules), n_ip))
          PY
          }

          # ------------------------------------------------------------
          # 分支 b：DustinWin / sing-box-ruleset
          # 默认会做域名合并优化（OPTIMIZE_B=0 则原样同步）
          # ------------------------------------------------------------
          clone https://github.com/DustinWin/ruleset_geodata.git sing-box-ruleset "$WORK/dw-sb"
          mkdir -p "$WORK/out-b"
          # git archive 导出文件时自动排除 .git 目录
          git -C "$WORK/dw-sb" archive HEAD | tar -x -C "$WORK/out-b"
          if [ "$OPTIMIZE_B" = 1 ]; then optimize_dir "$WORK/out-b" b; fi
          publish_branch b "$WORK/out-b"

          # ------------------------------------------------------------
          # 分支 a：SagerNet 的 geosite + geoip（仅 .srs）
          # 命名规则：
          #   geosite-xxx.srs          -> xxx.srs       （特殊项见 RENAME，手动项见 SITE_FIX）
          #   geosite-category-xxx.srs -> xxx.srs       （撞名时 -> xxxall.srs）
          #   geosite-google-xxx.srs   -> xxx.srs       （google-cn 除外；撞名时保留原名并警告）
          #   geosite-xxx-!cn.srs      -> xxx.srs       （撞名时保留原名并警告）
          #   geoip-xxx.srs            -> xxxip.srs     （如 geoip-cn.srs -> cnip.srs）
          #   BASE_FIX 里的项（crypto、geo-cn、proxy 等）按该表改名，@属性 自动保留
          # geosite 生成后统一做域名合并优化；geoip 不含域名，不处理
          # ------------------------------------------------------------
          clone https://github.com/SagerNet/sing-geosite.git rule-set "$WORK/sg-site"
          clone https://github.com/SagerNet/sing-geoip.git   rule-set "$WORK/sg-ip"
          mkdir -p "$WORK/out-a"

          # 检查特殊重命名表里的源文件是否都存在，缺失只警告不中断
          for key in "${!RENAME[@]}"; do
            if [ ! -f "$WORK/sg-site/geosite-$key.srs" ]; then
              echo "::warning::上游缺少 geosite-$key.srs"
            fi
          done

          # 第一步：登记已占用名称，并清空缓存
          TAKEN=(); MAPPED=()
          for v in "${RENAME[@]}";   do TAKEN[$v]=1; done   # 特殊表的目标名
          for v in "${SITE_FIX[@]}"; do TAKEN[$v]=1; done   # 手动表的目标名
          for v in "${BASE_FIX[@]}"; do TAKEN[$v]=1; done   # 按基础名改名表的目标名
          for f in "$WORK"/sg-site/geosite-*.srs; do        # 不会被自动改名的域名规则集
            key="$(basename "$f" .srs)"; key="${key#geosite-}"
            if ! is_plain "$key"; then continue; fi
            if [ -n "${RENAME[$key]:-}" ]; then continue; fi     # 已被改名，原名不再占用
            if is_fixed "$key"; then continue; fi
            TAKEN[$key]=1
          done
          for f in "$WORK"/sg-ip/geoip-*.srs; do            # 所有 ip 规则集：<名称>ip
            key="$(basename "$f" .srs)"; key="${key#geoip-}"
            TAKEN[${key}ip]=1
          done

          # 第二步：生成 geosite 文件，并做域名合并优化
          for f in "$WORK"/sg-site/geosite-*.srs; do
            key="$(basename "$f" .srs)"; key="${key#geosite-}"
            site_name "$key" 1
            put "$f" "$WORK/out-a/$SN.srs"
          done
          optimize_dir "$WORK/out-a" a

          # 第三步：生成 geoip 文件，geoip-xxx.srs -> xxxip.srs
          for f in "$WORK"/sg-ip/geoip-*.srs; do
            key="$(basename "$f" .srs)"; key="${key#geoip-}"
            put "$f" "$WORK/out-a/${key}ip.srs"
          done

          echo "分支 a 共 $(ls "$WORK/out-a" | wc -l) 个文件"
          publish_branch a "$WORK/out-a"

          # ------------------------------------------------------------
          # 分支 c：lyc8503/sing-box-rules 两个分支的全部规则文件（.json + .srs）
          #         + DustinWin sing-box-ruleset 的全部规则文件（名称后加 2）
          #         + QuixoticHeart singbox/version5 的全部规则文件（名称后加 3）
          #         + 合并去重生成的 adall（ad + ads2 + adrules 的域名部分）
          #         + 从 adrules 拆出的 ip 规则 adipall（注意：adip 是安道尔 geoip，不能用这个名字）
          # 命名规则：
          #   rule-set-geosite 分支：geosite-xxx.*          -> xxx.*     （手动项见 SITE_FIX / BASE_FIX）
          #                          geosite-category-xxx.* -> xxx.*     （撞名时 -> xxxall.*）
          #                          geosite-google-xxx.*   -> xxx.*     （google-cn 除外；撞名时保留原名并警告）
          #                          geosite-xxx-!cn.*      -> xxx.*     （撞名时保留原名并警告）
          #   rule-set-geoip   分支：geoip-xxx.*            -> xxxip.*
          #   最后再用 SagerNet 的 geoip-cn.srs 覆盖为 cnip.srs
          #   DustinWin：xxx.srs / xxx.json -> xxx2.srs / xxx2.json（特殊项见 dw_name）
          #   QuixoticHeart：xxx.srs / xxx.json -> xxx3.srs / xxx3.json
          #   adall.srs / adall.json：ad、ads2、adrules 的域名部分、AD_EXTRA 里的规则集、所有 @ads / @telemetry 结尾的规则集、
          #                           AD_EXTRA_SUFFIX 里的额外域名，合并去重后的结果
          #   proxy.srs / proxy.json：lyc 的 geolocation-!cn + DustinWin 的 proxy2 + QuixoticHeart 的 proxy3 合并后的结果
          #   cnall.srs / cnall.json：lyc 的 china-list + 所有以 @cn 结尾的规则集合并后的结果
          #   adipall.srs / adipall.json：adrules 里的全部 ip 规则
          # 上述文件（adall / adipall 除外，它们由合并工具生成，本身已精简）全部生成后，
          # 统一对域名规则集（.srs 和 .json）做合并优化
          # c 分支发布完成后，其最终的 .json 文件会被转换成 mihomo 的 mrs 格式，发布到 m 分支（见文末）
          # ------------------------------------------------------------
          clone https://github.com/lyc8503/sing-box-rules.git rule-set-geosite "$WORK/lyc-site"
          clone https://github.com/lyc8503/sing-box-rules.git rule-set-geoip   "$WORK/lyc-ip"
          mkdir -p "$WORK/out-c"

          # 第一步：登记已占用名称（.json 和 .srs 同名，按名称去重登记），并清空缓存
          TAKEN=(); MAPPED=()
          for v in "${SITE_FIX[@]}"; do TAKEN[$v]=1; done
          for v in "${BASE_FIX[@]}"; do TAKEN[$v]=1; done
          for f in "$WORK"/lyc-site/geosite-*; do
            name="$(basename "$f")"; name="${name#geosite-}"; stem="${name%.*}"
            if ! is_plain "$stem"; then continue; fi
            if is_fixed "$stem"; then continue; fi
            TAKEN[$stem]=1
          done
          for f in "$WORK"/lyc-ip/geoip-*; do
            name="$(basename "$f")"; name="${name#geoip-}"; stem="${name%.*}"
            TAKEN[${stem}ip]=1
          done
          TAKEN[cnip]=1   # 下面会用 SagerNet 的文件生成 cnip.srs

          # 第二步：geosite 去掉 geosite- 前缀，扩展名保持不变；不使用 RENAME 表
          for f in "$WORK"/lyc-site/geosite-*; do
            name="$(basename "$f")"; name="${name#geosite-}"
            ext="${name##*.}"; stem="${name%.*}"
            site_name "$stem" 0
            put "$f" "$WORK/out-c/${SN}.${ext}"
          done

          # 第三步：geoip-ad.json -> adip.json，先拆出名称和扩展名再拼接
          for f in "$WORK"/lyc-ip/geoip-*; do
            name="$(basename "$f")"; name="${name#geoip-}"
            ext="${name##*.}"; stem="${name%.*}"
            put "$f" "$WORK/out-c/${stem}ip.${ext}"
          done

          # cnip.srs 使用 SagerNet 的 geoip-cn.srs
          # 这里直接用 cp：如果 lyc 的 geoip 分支里也有 cn，会被有意覆盖，不需要警告
          cp "$WORK/sg-ip/geoip-cn.srs" "$WORK/out-c/cnip.srs"

          # 第四步：DustinWin 的 sing-box 规则集（复用分支 b 已克隆的 dw-sb）
          # 只取 .srs / .json，名称后加 2：cn.srs -> cn2.srs（特殊项见 dw_name）
          dw_count=0
          while IFS= read -r -d '' f; do
            name="$(basename "$f")"
            case "$name" in *.srs|*.json) ;; *) continue ;; esac
            ext="${name##*.}"; stem="${name%.*}"
            dw_name "$stem"
            put "$f" "$WORK/out-c/${DN}.${ext}"
            dw_count=$((dw_count + 1))
          done < <(find "$WORK/dw-sb" -path "$WORK/dw-sb/.git" -prune -o -type f -print0)
          echo "DustinWin 规则文件已加入 c 分支：$dw_count 个"

          # 第五步：QuixoticHeart / rule-set 的 singbox/version5 全部规则文件（名称后加 3）
          # 只取 .srs / .json：cn.srs -> cn3.srs，cn.json -> cn3.json
          # 克隆或目录检查失败会直接中断，此时 c 分支不会被改动，保留上一次的内容
          QH_DIR="$WORK/qh/singbox/version5"
          git clone -q --depth 1 --branch ruleset --filter=blob:none --sparse \
            https://github.com/QuixoticHeart/rule-set.git "$WORK/qh"
          git -C "$WORK/qh" sparse-checkout set singbox/version5
          if [ ! -d "$QH_DIR" ] || [ -z "$(ls -A "$QH_DIR")" ]; then
            echo "::error::QuixoticHeart 的 singbox/version5 目录不存在或为空，已中断，c 分支保持不变"
            exit 1
          fi
          qh_count=0
          for f in "$QH_DIR"/*; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            case "$name" in *.srs|*.json) ;; *) continue ;; esac
            ext="${name##*.}"; stem="${name%.*}"
            put "$f" "$WORK/out-c/${stem}3.${ext}"
            qh_count=$((qh_count + 1))
          done
          echo "QuixoticHeart 规则文件已加入 c 分支：$qh_count 个"

          # 第五步半：对 c 分支目前所有的域名规则集（.srs 和 .json）做合并优化
          # 放在 adall 之前，这样下面合并用到的 ad.srs / ads2.srs 已经是精简过的
          optimize_dir "$WORK/out-c" c

          # 第六步：处理 adrules（同步自 QuixoticHeart）
          #   1. 拆成域名部分和 ip 部分
          #   2. 域名部分与 ad（lyc 的 category-ads-all）、ads2（DustinWin 的 ads）、AD_EXTRA 里的规则集、
          #      所有以 AD_SUFFIX（@ads / @telemetry）结尾的规则集、AD_EXTRA_SUFFIX 里的额外域名
          #      合并去重 -> adall（被并入的规则集原文件随后删除）
          #   3. ip 部分单独编译 -> adipall
          # 任何一步失败都不中断同步，而是沿用远端 c 分支上一次的版本
          ADTMP="$WORK/adrules-split"; rm -rf "$ADTMP"; mkdir -p "$ADTMP"
          if install_singbox && split_adrules "$QH_DIR/adrules.srs" "$ADTMP"; then
            # 额外的 domain_suffix 写成一个临时 json，作为合并输入之一
            ad_inputs=("$WORK/out-c/ad.srs" "$WORK/out-c/ads2.srs" "$ADTMP/adrules-domain.json")
            if [ "${#AD_EXTRA_SUFFIX[@]}" -gt 0 ]; then
              sfx=""
              for d in "${AD_EXTRA_SUFFIX[@]}"; do sfx="$sfx${sfx:+,}\"$d\""; done
              printf '{"version":2,"rules":[{"domain_suffix":[%s]}]}\n' "$sfx" > "$ADTMP/ad-extra-suffix.json"
              ad_inputs+=("$ADTMP/ad-extra-suffix.json")
            fi
            list_by_suffix "${AD_SUFFIX[@]}"
            if merge_group adall "${ad_inputs[@]}" "${AD_EXTRA[@]}" "${LIST[@]}"; then
              echo "adall 合并完成（指定规则集 ${#AD_EXTRA[@]} 个，后缀匹配规则集 ${#LIST[@]} 个，额外 domain_suffix ${#AD_EXTRA_SUFFIX[@]} 条）"
            else
              echo "::warning::adall 合并失败，沿用远端 c 分支上一次的版本"
              keep_old adall
            fi
            if [ ! -f "$ADTMP/adipall.json" ]; then
              echo "::warning::adrules 里没有 ip 规则，本次不生成 adipall"
            elif "$SB" rule-set compile "$ADTMP/adipall.json" -o "$ADTMP/adipall.srs"; then
              put "$ADTMP/adipall.json" "$WORK/out-c/adipall.json"
              put "$ADTMP/adipall.srs"  "$WORK/out-c/adipall.srs"
              echo "adipall 生成完成"
            else
              echo "::warning::adipall 编译失败，沿用远端 c 分支上一次的版本"
              keep_old adipall
            fi
          else
            echo "::warning::adrules 拆分失败，adall 和 adipall 沿用远端 c 分支上一次的版本"
            keep_old adall
            keep_old adipall
          fi

          # 第七步：合并 proxy = lyc 的 geolocation-!cn（已按 BASE_FIX 改名为 proxy）+ DustinWin 的 proxy2 + QuixoticHeart 的 proxy3
          # 合并成功后 proxy2、proxy3 从 c 分支删除；失败则保持原样（proxy、proxy2、proxy3 并存）
          if install_singbox && merge_group proxy proxy proxy2 proxy3; then
            echo "proxy 合并完成"
          else
            echo "::warning::proxy 合并失败，proxy、proxy2、proxy3 保持原样"
          fi

          # 第八步：合并 cnall = lyc 的 china-list（已按 BASE_FIX 改名为 cnall）+ 所有以 CN_SUFFIX（@cn）结尾的规则集
          # AD_EXTRA 里的名称除外（它们并入 adall）；成功后这些规则集的原文件从 c 分支删除，失败则保持原样
          list_by_suffix "${CN_SUFFIX[@]}"
          if [ "${#LIST[@]}" = 0 ]; then
            echo "没有以 ${CN_SUFFIX[*]} 结尾的规则集，cnall 保持原样"
          elif install_singbox && merge_group cnall cnall "${LIST[@]}"; then
            echo "cnall 合并完成（并入 ${#LIST[@]} 个规则集）"
          else
            echo "::warning::cnall 合并失败，保持原样"
          fi

          echo "分支 c 共 $(ls "$WORK/out-c" | wc -l) 个文件"
          publish_branch c "$WORK/out-c"

          # ------------------------------------------------------------
          # 分支 m：由 c 分支转换而来的 mihomo 规则集（.mrs）
          # 必须放在最后：c 分支所有改名、合并、去重、优化全部完成并发布成功后，
          # 才读取 $WORK/out-c 里的最终 .json 文件进行转换（不再经过 srs -> json）
          #
          # 转换规则（mrs 只支持 domain / ipcidr 两种 behavior）：
          #   - domain        -> "example.com"       （精确匹配）
          #   - domain_suffix -> "+.example.com"     （匹配本身及所有子域，与 sing-box 的不带点后缀语义一致）
          #                      ".example.com"      （带点后缀，只匹配子域，原样保留）
          #   - ip_cidr       -> ipcidr 规则集；裸 IP 补成 /32 或 /128，去重并合并相邻网段
          #   - domain 里写成 IP 字面量的条目，按 ip 处理
          #   - domain_keyword / domain_regex 以及其他字段（端口、进程名、logical 规则等）mrs 无法表示，丢弃，日志里会统计
          #   - 一个 json 里同时含域名和 ip 时：域名部分 -> <名称>.mrs，ip 部分 -> <名称>ip.mrs
          #     （若 <名称>ip 已被 c 分支里的另一个规则集占用，则改用 <名称>ipall.mrs 并警告；再撞名则丢弃该 ip 部分并警告）
          #     只含其中一种时，直接用 <名称>.mrs（名称和 c 分支的 json 文件名一致）
          #   - 单个文件转换失败时，沿用远端 m 分支上一次的同名文件，不影响其他文件
          # ------------------------------------------------------------

          # install_mihomo：下载 MetaCubeX 最新稳定版 mihomo，路径放在全局变量 MH
          # 用 releases/latest，只取稳定版；资源名用完整精确名称，避免匹配到 compatible / v1 / v2 / v3 等变体
          install_mihomo() {
            local tag
            if [ -n "${MH:-}" ] && [ -x "$MH" ]; then return 0; fi
            tag="$(gh api repos/MetaCubeX/mihomo/releases/latest --jq .tag_name)" || return 1
            mkdir -p "$WORK/mh"
            gh release download "$tag" --repo MetaCubeX/mihomo \
              --pattern "mihomo-linux-amd64-${tag}.gz" --dir "$WORK/mh" || return 1
            gunzip -f "$WORK/mh/mihomo-linux-amd64-${tag}.gz" || return 1
            MH="$WORK/mh/mihomo-linux-amd64-${tag}"
            chmod +x "$MH" || return 1
            "$MH" -v >/dev/null 2>&1 || return 1
            echo "转换使用 mihomo $tag"
          }

          # mrs_prep.py：读取 c 分支目录里的全部 .json，提取域名 / ip 规则，写成 mihomo 可转换的 text 文件
          # 用法：mrs_prep.py <c 分支目录> <中间文件目录> <清单文件> <m 分支输出目录>
          # 清单每行（制表符分隔）：behavior <TAB> 源 txt <TAB> 目标 mrs
          # 解析失败的 json 对应的目标文件名会写入 <中间文件目录>/failed.txt，用于沿用旧文件
          cat > "$WORK/mrs_prep.py" <<'PY'
          import ipaddress, json, os, re, sys

          indir, stage, manifest, outdir = sys.argv[1:5]
          BAD = re.compile(r"[\s/:*,'\"]")
          SUP = {"type", "domain", "domain_suffix", "ip_cidr", "domain_keyword", "domain_regex"}

          def lst(v):
              # sing-box 允许把字段写成单个字符串
              return [v] if isinstance(v, str) else list(v)

          def ok_dom(d):
              d0 = d[1:] if d.startswith(".") else d
              return bool(d0) and not d0.startswith(".") and not d0.endswith(".") and ".." not in d0 and not BAD.search(d0)

          # c 分支里所有 json 的名称：用来判断 <名称>ip 是否已被别的规则集占用
          stems = {fn[:-5] for fn in os.listdir(indir) if fn.endswith(".json")}

          n_files = n_dom = n_ip = n_both = n_empty = 0
          bad = lost_kw = lost_rx = lost_other = 0
          lines, failed = [], []

          for fn in sorted(os.listdir(indir)):
              if not fn.endswith(".json"):
                  continue
              name = fn[:-5]
              n_files += 1
              try:
                  d = json.load(open(os.path.join(indir, fn), encoding="utf-8"))
                  rules = d.get("rules", [])
              except Exception as e:
                  print("::warning::无法解析 %s，将沿用 m 分支上一次的版本：%s" % (fn, e))
                  failed.append(name + ".mrs")
                  # 该文件原本可能拆出的 ip 部分（<名称>ip.mrs）：仅在没有同名 json 占用时才沿用
                  if name + "ip" not in stems:
                      failed.append(name + "ip.mrs")
                  continue

              dom, suf, nets = set(), set(), set()
              for r in rules:
                  if not isinstance(r, dict):
                      continue
                  for k, v in r.items():
                      if k == "domain":
                          for x in lst(v):
                              x = x.strip().lower()
                              try:
                                  nets.add(ipaddress.ip_network(x))   # IP 字面量当作 /32 或 /128
                                  continue
                              except ValueError:
                                  pass
                              if ok_dom(x):
                                  dom.add(x)
                              else:
                                  bad += 1
                      elif k == "domain_suffix":
                          for x in lst(v):
                              x = x.strip().lower()
                              if ok_dom(x):
                                  suf.add(x)
                              else:
                                  bad += 1
                      elif k == "ip_cidr":
                          for x in lst(v):
                              try:
                                  nets.add(ipaddress.ip_network(x.strip(), strict=False))
                              except ValueError:
                                  bad += 1
                      elif k == "domain_keyword":
                          lost_kw += len(lst(v))
                      elif k == "domain_regex":
                          lost_rx += len(lst(v))
                      elif k not in SUP:
                          lost_other += 1

              # 精确 domain "x" 已被不带点后缀 "x"（+.x）覆盖的，删掉
              dom -= {s for s in suf if not s.startswith(".")}
              dl = sorted(dom) + sorted(s if s.startswith(".") else "+." + s for s in suf)

              col = []
              for v in (4, 6):
                  col += list(ipaddress.collapse_addresses([n for n in nets if n.version == v]))
              col.sort(key=lambda n: (n.version, n))

              if not dl and not col:
                  n_empty += 1
                  continue

              dom_dst = name + ".mrs"
              ip_dst = name + ".mrs"          # 只含 ip：直接用原名
              if dl and col:
                  # 同时含域名和 ip：ip 部分命名为 <名称>ip.mrs，撞名则依次尝试 <名称>ipall.mrs，再撞名就丢弃
                  if name + "ip" not in stems:
                      ip_dst = name + "ip.mrs"
                  elif name + "ipall" not in stems:
                      ip_dst = name + "ipall.mrs"
                      print("::warning::%s 的 ip 部分命名为 %sip 会与已有规则集撞名，已改为 %s" % (fn, name, ip_dst))
                  else:
                      ip_dst = None
                      print("::warning::%s 的 ip 部分无法命名（%sip、%sipall 均已被占用），已丢弃该 ip 部分" % (fn, name, name))

              if dl:
                  p = os.path.join(stage, name + ".domain.txt")
                  open(p, "w", encoding="utf-8").write("\n".join(dl) + "\n")
                  lines.append("domain\t%s\t%s" % (p, os.path.join(outdir, dom_dst)))
                  n_dom += 1
              if col and ip_dst:
                  p = os.path.join(stage, name + ".ip.txt")
                  open(p, "w", encoding="utf-8").write("\n".join(str(n) for n in col) + "\n")
                  lines.append("ipcidr\t%s\t%s" % (p, os.path.join(outdir, ip_dst)))
                  n_ip += 1
              if dl and col and ip_dst:
                  n_both += 1
                  print("::notice::%s 同时含域名和 ip，已拆成 %s 和 %s" % (fn, dom_dst, ip_dst))

          open(manifest, "w", encoding="utf-8").write("\n".join(lines) + ("\n" if lines else ""))
          open(os.path.join(stage, "failed.txt"), "w", encoding="utf-8").write("\n".join(failed) + ("\n" if failed else ""))
          print("读取 %d 个 json：域名规则集 %d 个，ip 规则集 %d 个（其中同时含两者 %d 个），无可转换内容 %d 个" % (n_files, n_dom, n_ip, n_both, n_empty))
          print("丢弃：domain_keyword %d 条，domain_regex %d 条，其他不支持的字段 %d 处，非法条目 %d 条" % (lost_kw, lost_rx, lost_other, bad))
          PY

          # conv_one.sh：把若干条清单记录逐条转成 mrs，由 xargs 并行调用
          # 依赖环境变量：MH（mihomo 路径）
          # 每条输出一行：OK <behavior> <文件名> 或 FAIL <文件名> <原因>
          cat > "$WORK/conv_one.sh" <<'SH'
          for e in "$@"; do
            IFS=$'\t' read -r beh src dst <<< "$e"
            name="$(basename "$dst")"
            rm -f "$dst"
            if ! err="$("$MH" convert-ruleset "$beh" text "$src" "$dst" 2>&1)" || [ ! -s "$dst" ]; then
              printf 'FAIL\t%s\t%s\n' "$name" "$(printf '%s' "$err" | tail -n 1 | tr '\t\n' '  ')"
              rm -f "$dst"
              continue
            fi
            printf 'OK\t%s\t%s\n' "$beh" "$name"
          done
          SH

          # keep_old_m <文件名>：沿用远端 m 分支上一次的同名文件（转换失败时用，没有就跳过）
          # 本次已经成功生成了同名文件时不覆盖
          keep_old_m() {
            if [ -e "$WORK/out-m/$1" ]; then return 0; fi
            if git cat-file -e "origin/m:$1" 2>/dev/null; then
              git show "origin/m:$1" > "$WORK/out-m/$1"
              echo "::notice::m 分支沿用上一次的 $1"
            fi
          }

          # build_m：把 out-c 里的 json 转成 out-m 里的 mrs；整体性失败（装不上 mihomo、没有可转换内容）时返回 1
          build_m() {
            local stage="$WORK/mrs-stage" manifest="$WORK/mrs-manifest.txt" log="$WORK/mrs.log" nm
            rm -rf "$stage" "$WORK/out-m"; mkdir -p "$stage" "$WORK/out-m"

            if ! ls "$WORK"/out-c/*.json >/dev/null 2>&1; then
              echo "::error::c 分支目录里没有 json 文件，无法生成 m 分支"
              return 1
            fi
            if ! install_mihomo; then
              echo "::error::mihomo 安装失败，m 分支未更新"
              return 1
            fi

            python3 "$WORK/mrs_prep.py" "$WORK/out-c" "$stage" "$manifest" "$WORK/out-m" || return 1
            if [ ! -s "$manifest" ]; then
              echo "::error::没有可转换成 mrs 的内容，m 分支未更新"
              return 1
            fi

            : > "$log"
            MH="$MH" xargs -d '\n' -r -n 16 -P "$(nproc)" bash "$WORK/conv_one.sh" < "$manifest" > "$log" || true
            awk -F'\t' '
              $1 == "OK"   { if ($2 == "domain") d++; else i++ }
              $1 == "FAIL" { fail++; if (fail <= 10) print "::warning::mrs 转换失败，将沿用上一次的文件：" $2 "（" $3 "）" }
              END { printf "mrs 转换完成：domain %d 个，ipcidr %d 个，失败 %d 个\n", d, i, fail }
            ' "$log"

            # 转换失败的（以及 json 解析失败的），沿用远端 m 分支上一次的同名文件
            { awk -F'\t' '$1 == "FAIL" { print $2 }' "$log"; cat "$stage/failed.txt"; } | sort -u \
              | while IFS= read -r nm; do
                  [ -n "$nm" ] && keep_old_m "$nm"
                done

            echo "分支 m 共 $(ls "$WORK/out-m" | wc -l) 个文件"
          }

          if build_m; then
            publish_branch m "$WORK/out-m"
          else
            echo "::error::m 分支生成失败（c 分支已正常发布），m 分支保持不变"
            exit 1
          fi
          # ------------------------------------------------------------
          # 【改动 1】把原来 m 分支末尾的这一段
          #     if build_m; then
          #       publish_branch m "$WORK/out-m"
          #     else
          #       echo "::error::m 分支生成失败（c 分支已正常发布），m 分支保持不变"
          #       exit 1
          #     fi
          # 替换成下面这段（m 失败不再直接退出，只做标记，让最后一步的数据库照常生成）
          # ------------------------------------------------------------
          M_FAIL=0
          if build_m; then
            publish_branch m "$WORK/out-m"
          else
            echo "::error::m 分支生成失败（c 分支已正常发布），m 分支保持不变"
            M_FAIL=1
          fi

          # ------------------------------------------------------------
          # 【改动 2】紧接着加上面这一段之后：分支 g（最后一步）
          # mihomo 的 geosite.dat + geoip.dat：由 c 分支最终的 .json 合并而来
          # 必须放在最后：c、m 全部生成并发布完成后才读取 $WORK/out-c
          #   - 名称 = c 分支里的规则集名称（大小写都能匹配）；一个规则集里域名进 geosite，ip 进 geoip
          #   - domain_keyword / domain_regex 在 geosite.dat 里有对应类型，不像 mrs 那样丢弃
          #   - 名称里的 @ 改成 _（geosite 里 @ 是属性语法）
          #   - mihomo 要求自定义库里必须有 CN，否则判定无效并重新下载官方库：
          #     geosite 的 CN 取 geo-cn（没有则 cnall），geoip 的 CN 取 cnip（没有则 cnall），脚本自动补
          # 客户端用法：GEOSITE,<名称>,组名 和 GEOIP,<名称>,组名，库文件从 g 分支下载
          # ------------------------------------------------------------

          # 只收录客户端用到的规则集（空 = 全部收录，但 c 分支约 2000 个规则集，文件会非常大）
          GEO_NAMES="adall anthropic openai gemini meta xai youtube play telegram twitter discord netflix disney spotify tiktok primevideo hulu abema bahamut reddit linkedin twitch github slack notion speedtestall paypal crypto amazon bytedance apple microsoft google media ai pt gfw games dev proxy apple-cn tld-cn geo-cn cnall adipall cnip telegramip"

          cat > "$WORK/gen_geodata.py" <<'PY'
          # gen_geodata.py <json目录> <输出目录>
          # 把目录里的 sing-box 源码格式规则集（.json）合并成 v2ray 格式的 geosite.dat 和 geoip.dat
          #   文件名（去掉 .json）= 规则集名称，统一转大写写入；客户端 GEOSITE / GEOIP 规则里大小写都能匹配
          #   geosite：domain -> Full，domain_suffix -> Domain，domain_keyword -> Plain，domain_regex -> Regex
          #            （带点后缀 ".x" 本应只匹配子域，这里近似为 Domain "x"，多匹配一个根域名本身，影响可忽略）
          #   geoip  ：ip_cidr（含写成 IP 字面量的 domain）-> CIDR
          #   一个规则集里域名和 ip 并存时，域名进 geosite，ip 进 geoip，名称相同、互不冲突
          #   名称里的 "@" 在 geosite 里是"属性"语法，会被当作属性过滤，所以替换成 "_"
          #   mihomo 加载自定义库时会先检查里面有没有 CN，没有就判定文件无效、删掉并重新下载官方库，
          #   所以这里自动补一个 CN：geosite 的 CN 取 GEO-CN（没有则 CNALL），geoip 的 CN 取 CNIP（没有则 CNALL）
          import ipaddress, json, os, re, sys

          indir, outdir = sys.argv[1:3]
          only = set(os.environ.get("GEO_NAMES", "").split())   # 非空时只收录这些名称（不含扩展名）

          def varint(n):
              b = bytearray()
              while True:
                  c = n & 0x7F; n >>= 7
                  if n: b.append(c | 0x80)
                  else: b.append(c); return bytes(b)

          def field_len(no, data):          # 长度前缀字段（string / bytes / 嵌套消息）
              return varint(no << 3 | 2) + varint(len(data)) + data

          def field_vint(no, v):            # varint 字段
              return varint(no << 3) + varint(v)

          def lst(v):
              return [v] if isinstance(v, str) else list(v)

          PLAIN, REGEX, DOMAIN, FULL = 0, 1, 2, 3
          BAD = re.compile(r"[\s/:*,'\"]")

          def domain_msg(t, value):         # GeoSite.domain（proto3：枚举 0 不写）
              return field_len(2, (field_vint(1, t) if t else b"") + field_len(2, value.encode()))

          site, ip = {}, {}                 # 名称 -> 条目字节（不含 country_code）
          st = dict(kw=0, rx=0, dotted=0, bad=0)

          for fn in sorted(os.listdir(indir)):
              if not fn.endswith(".json"):
                  continue
              if only and fn[:-5] not in only:
                  continue
              name = fn[:-5].replace("@", "_").upper()
              try:
                  rules = json.load(open(os.path.join(indir, fn), encoding="utf-8")).get("rules", [])
              except Exception as e:
                  print("::warning::geodata 跳过无法解析的 %s：%s" % (fn, e)); continue

              ents, nets = {}, set()
              for r in rules:
                  if not isinstance(r, dict): continue
                  for k, v in r.items():
                      if k == "domain":
                          for x in lst(v):
                              x = x.strip().lower()
                              try: nets.add(ipaddress.ip_network(x)); continue
                              except ValueError: pass
                              if x and not BAD.search(x): ents[(FULL, x)] = 1
                              else: st["bad"] += 1
                      elif k == "domain_suffix":
                          for x in lst(v):
                              x = x.strip().lower()
                              if not x or BAD.search(x.lstrip(".")): st["bad"] += 1; continue
                              if x.startswith("."): x = x[1:]; st["dotted"] += 1
                              ents[(DOMAIN, x)] = 1
                      elif k == "domain_keyword":
                          for x in lst(v):
                              if x.strip(): ents[(PLAIN, x.strip().lower())] = 1; st["kw"] += 1
                      elif k == "domain_regex":
                          for x in lst(v):
                              if x.strip(): ents[(REGEX, x.strip())] = 1; st["rx"] += 1
                      elif k == "ip_cidr":
                          for x in lst(v):
                              try: nets.add(ipaddress.ip_network(x.strip(), strict=False))
                              except ValueError: st["bad"] += 1

              sufs = {v for (t, v) in ents if t == DOMAIN}          # 被后缀覆盖的精确域名去掉，不影响匹配结果
              for (t, v) in list(ents):
                  if t == FULL and v in sufs: del ents[(t, v)]

              if ents:
                  site[name] = b"".join(domain_msg(t, v) for (t, v) in sorted(ents))
              if nets:
                  col = []
                  for ver in (4, 6):
                      col += list(ipaddress.collapse_addresses([n for n in nets if n.version == ver]))
                  ip[name] = b"".join(
                      field_len(2, field_len(1, n.network_address.packed) + (field_vint(2, n.prefixlen) if n.prefixlen else b""))
                      for n in col)

          def add_cn(d, label, prefer):
              if "CN" in d: return
              for src in prefer:
                  if src in d:
                      d["CN"] = d[src]; print("%s 里没有 CN，已用 %s 的内容补一个（mihomo 校验需要）" % (label, src)); return
              print("::warning::%s 里没有 CN，也没有可替代的 %s，mihomo 会判定库无效并重新下载官方库" % (label, "/".join(prefer)))

          add_cn(site, "geosite", ["GEO-CN", "CNALL"])
          add_cn(ip, "geoip", ["CNIP", "CNALL"])

          if not site and not ip:
              sys.exit("没有生成任何内容")
          os.makedirs(outdir, exist_ok=True)
          # 按名称排序写入；每个条目 = country_code + 内容，再包一层 entry（字段 1）
          for fname, d in (("geosite.dat", site), ("geoip.dat", ip)):
              open(os.path.join(outdir, fname), "wb").write(
                  b"".join(field_len(1, field_len(1, n.encode()) + d[n]) for n in sorted(d)))
          print("geosite %d 个、geoip %d 个；keyword %d、regex %d、带点后缀 %d、非法条目 %d" %
                (len(site), len(ip), st["kw"], st["rx"], st["dotted"], st["bad"]))
          PY

          # build_g：c 分支最终 json -> $WORK/out-g/geosite.dat + geoip.dat
          build_g() {
            local src="$WORK/geo-src" out="$WORK/out-g"
            rm -rf "$src" "$out"; mkdir -p "$src" "$out"
            if ! ls "$WORK"/out-c/*.json >/dev/null 2>&1; then
              echo "::error::c 分支目录里没有 json 文件，无法生成数据库"; return 1
            fi
            cp "$WORK"/out-c/*.json "$src"/

            # c 分支的 cnip.srs 来自 SagerNet，而 cnip.json 来自 lyc；以 .srs 为准重新导出 json
            if [ -f "$WORK/out-c/cnip.srs" ] && install_singbox; then
              if "$SB" rule-set decompile "$WORK/out-c/cnip.srs" -o "$src/cnip.tmp" >/dev/null 2>&1 && [ -s "$src/cnip.tmp" ]; then
                mv "$src/cnip.tmp" "$src/cnip.json"
              else
                rm -f "$src/cnip.tmp"; echo "::warning::cnip.srs 反编译失败，数据库里的 cnip 沿用 lyc 的 json"
              fi
            fi

            GEO_NAMES="$GEO_NAMES" python3 "$WORK/gen_geodata.py" "$src" "$out" || return 1
            if [ ! -s "$out/geosite.dat" ] || [ ! -s "$out/geoip.dat" ]; then
              echo "::error::geosite.dat 或 geoip.dat 为空"; return 1
            fi
            # 收录名单里的名称没生成出来（c 分支里不存在或没有可用内容）时给出警告
            local n
            for n in $GEO_NAMES; do
              [ -f "$src/$n.json" ] || echo "::warning::数据库缺少规则集：$n（c 分支里没有 $n.json）"
            done
            ls -la "$out"
          }

          if build_g; then
            publish_branch g "$WORK/out-g"
          else
            echo "::error::数据库生成失败，g 分支保持不变"
            exit 1
          fi

          # 前面 m 分支失败过的话，这里让整个任务标红（不影响上面已经发布的 c 和 g）
          [ "$M_FAIL" = 0 ] || exit 1


      # 保活：公共仓库 60 天无活动会被自动停用定时任务，这里定期重置计时
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable "${{ github.workflow }}" --repo "${{ github.repository }}" || true
          
