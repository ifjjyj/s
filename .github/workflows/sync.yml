name: Sync Upstream Ruleset

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ===== 分支 b / m：同步 DustinWin =====
          git remote add upstream https://github.com/DustinWin/ruleset_geodata.git
          git fetch upstream

          git checkout -B b
          git reset --hard upstream/sing-box-ruleset
          git checkout -B m
          git reset --hard upstream/mihomo-ruleset

          git push origin b --force
          git push origin m --force

          # ===== 分支 a：同步 SagerNet geosite + geoip，并重命名 =====
          WORK="$RUNNER_TEMP/sager"
          rm -rf "$WORK" && mkdir -p "$WORK/out"

          git clone --depth 1 --branch rule-set https://github.com/SagerNet/sing-geosite.git "$WORK/geosite"
          git clone --depth 1 --branch rule-set https://github.com/SagerNet/sing-geoip.git "$WORK/geoip"

          # geosite-xxx.srs -> xxx.srs
          for f in "$WORK"/geosite/geosite-*.srs; do
            name="$(basename "$f")"
            cp "$f" "$WORK/out/${name#geosite-}"
          done

          # geoip-xxx.srs -> ipxxx.srs
          for f in "$WORK"/geoip/geoip-*.srs; do
            name="$(basename "$f")"
            cp "$f" "$WORK/out/ip${name#geoip-}"
          done

          echo "共生成 $(ls "$WORK/out" | wc -l) 个文件"

          # 切到分支 a：远端已有就基于它，没有就新建孤儿分支
          if git ls-remote --exit-code --heads origin a >/dev/null 2>&1; then
            git fetch origin a
            git checkout -f -B a origin/a
          else
            git checkout --orphan a
          fi

          # 清空旧内容后放入新文件，这样上游删除的规则集也会同步删除
          git rm -rf . -q 2>/dev/null || true
          git clean -fdx -q
          cp "$WORK"/out/*.srs .

          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "sync sagernet rulesets $(date -u +'%Y-%m-%d %H:%M')"
            git push origin a
          else
            echo "分支 a 无变化，跳过推送"
          fi
